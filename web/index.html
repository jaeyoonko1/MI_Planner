  <div class="app" id="app">
    <aside class="rail" id="sidebar" aria-label="사이드바">
      <a href="#/" class="brand" aria-label="MI_Planner 홈">
        <span class="brand-mark"><svg class="i"><use href="#logo"/></svg></span>
        <span><b>MI_Planner</b><small>LOCAL WORKSPACE</small></span>
      </a>
      <div class="rail-scroll">
        <nav id="nav" aria-label="바로가기">
          <a href="#/today" data-screen="today"><svg class="i"><use href="#home"/></svg><span class="lbl">오늘</span></a>
          <a href="#/todos" data-screen="todos"><svg class="i"><use href="#todo"/></svg><span class="lbl">할일</span></a>
          <a href="#/week" data-screen="week"><svg class="i"><use href="#week"/></svg><span class="lbl">주간 일지</span></a>
          <a href="#/structure" data-screen="structure"><svg class="i"><use href="#hier"/></svg><span class="lbl">구조</span></a>
          <a href="#/month" data-screen="month"><svg class="i"><use href="#cal"/></svg><span class="lbl">월간 일지</span></a>
        </nav>
        <div class="rail-label">페이지<button id="btn-new-root" class="ib" title="최상위 페이지 추가" aria-label="최상위 페이지 추가"><svg class="i s"><use href="#plus"/></svg></button></div>
        <nav id="tree" aria-label="페이지 트리"></nav>
      </div>
      <div class="rail-foot"><span class="dot"></span><span class="grow">로컬 · 외부 연결 없음</span></div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="ib" id="btn-rail" title="사이드바 접기·펼치기 ( [ )" aria-label="사이드바 접기 또는 펼치기" aria-controls="sidebar" aria-expanded="true"><svg class="i"><use href="#rail"/></svg></button>
        <nav class="crumb" id="crumb" aria-label="현재 위치"></nav>
        <span class="save" id="save" role="status" aria-live="polite"><i></i><span></span></span>
        <div class="seg" id="seg-theme" role="group" aria-label="테마"></div>
        <div class="seg" id="seg-density" role="group" aria-label="화면 밀도"></div>
      </header>
      <main id="view"></main>
    </div>
  </div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
