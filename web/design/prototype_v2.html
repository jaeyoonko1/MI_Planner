<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MI Planner — 디자인 프로토타입 v2</title>
<!-- 정적 프로토타입: 가짜 데이터, 외부 요청 0 (웹폰트·CDN 없음) -->
<style>
:root{
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Display", "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;

  --bg:#f5f5f7; --surface:#ffffff; --surface-2:#fbfbfd; --raised:#ffffff;
  --fill:rgba(118,118,128,.12); --fill-2:rgba(118,118,128,.07); --fill-3:rgba(118,118,128,.18);
  --ink:#1d1d1f; --ink-2:#424245; --ink-3:#6e6e73; --ink-4:#a1a1a6;
  --sep:rgba(0,0,0,.07); --sep-2:rgba(0,0,0,.12);
  --accent:#0071e3; --accent-ink:#0066cc; --accent-soft:rgba(0,113,227,.09); --accent-ring:rgba(0,113,227,.28);
  --red:#ff3b30; --red-ink:#d70015; --red-soft:rgba(255,59,48,.10);
  --orange:#ff9500; --orange-ink:#b25000; --orange-soft:rgba(255,149,0,.13);
  --green:#34c759; --green-ink:#1f7a35; --green-soft:rgba(52,199,89,.14);
  --indigo:#5856d6;
  --sidebar:rgba(236,236,241,.72); --glass:rgba(255,255,255,.72);
  --sh-1:0 0 0 .5px rgba(0,0,0,.05), 0 1px 2px rgba(0,0,0,.04);
  --sh-2:0 0 0 .5px rgba(0,0,0,.06), 0 2px 6px rgba(0,0,0,.04), 0 12px 32px rgba(0,0,0,.06);
  --sh-3:0 0 0 .5px rgba(0,0,0,.08), 0 24px 70px rgba(0,0,0,.22);
  --st0:rgba(118,118,128,.11); --stt0:#6e6e73;
  --st1:rgba(0,113,227,.10);  --stt1:#0066cc;
  --st2:rgba(0,113,227,.20);  --stt2:#0058b0;
  --st3:rgba(0,113,227,.36);  --stt3:#003f80;
  --st4:rgba(0,113,227,.52);  --stt4:#002a57;
  --st5:rgba(52,199,89,.17);  --stt5:#1f7a35;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#1c1c1e; --surface-2:#232326; --raised:#2c2c2e;
    --fill:rgba(118,118,128,.24); --fill-2:rgba(118,118,128,.14); --fill-3:rgba(118,118,128,.32);
    --ink:#f5f5f7; --ink-2:#d1d1d6; --ink-3:#98989d; --ink-4:#636366;
    --sep:rgba(255,255,255,.08); --sep-2:rgba(255,255,255,.14);
    --accent:#0a84ff; --accent-ink:#4da3ff; --accent-soft:rgba(10,132,255,.16); --accent-ring:rgba(10,132,255,.4);
    --red:#ff453a; --red-ink:#ff6961; --red-soft:rgba(255,69,58,.16);
    --orange:#ff9f0a; --orange-ink:#ffb340; --orange-soft:rgba(255,159,10,.16);
    --green:#30d158; --green-ink:#4cd964; --green-soft:rgba(48,209,88,.16);
    --sidebar:rgba(28,28,30,.72); --glass:rgba(28,28,30,.72);
    --sh-1:0 0 0 .5px rgba(255,255,255,.07); --sh-2:0 0 0 .5px rgba(255,255,255,.09), 0 12px 32px rgba(0,0,0,.5);
    --sh-3:0 0 0 .5px rgba(255,255,255,.12), 0 24px 70px rgba(0,0,0,.6);
    --st0:rgba(118,118,128,.22); --stt0:#98989d; --st1:rgba(10,132,255,.16); --stt1:#6cb4ff;
    --st2:rgba(10,132,255,.30); --stt2:#a8d1ff; --st3:rgba(10,132,255,.50); --stt3:#ffffff;
    --st4:rgba(10,132,255,.72); --stt4:#ffffff; --st5:rgba(48,209,88,.20); --stt5:#4cd964;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1c1c1e; --surface-2:#232326; --raised:#2c2c2e;
  --fill:rgba(118,118,128,.24); --fill-2:rgba(118,118,128,.14); --fill-3:rgba(118,118,128,.32);
  --ink:#f5f5f7; --ink-2:#d1d1d6; --ink-3:#98989d; --ink-4:#636366;
  --sep:rgba(255,255,255,.08); --sep-2:rgba(255,255,255,.14);
  --accent:#0a84ff; --accent-ink:#4da3ff; --accent-soft:rgba(10,132,255,.16); --accent-ring:rgba(10,132,255,.4);
  --red:#ff453a; --red-ink:#ff6961; --red-soft:rgba(255,69,58,.16);
  --orange:#ff9f0a; --orange-ink:#ffb340; --orange-soft:rgba(255,159,10,.16);
  --green:#30d158; --green-ink:#4cd964; --green-soft:rgba(48,209,88,.16);
  --sidebar:rgba(28,28,30,.72); --glass:rgba(28,28,30,.72);
  --sh-1:0 0 0 .5px rgba(255,255,255,.07); --sh-2:0 0 0 .5px rgba(255,255,255,.09), 0 12px 32px rgba(0,0,0,.5);
  --sh-3:0 0 0 .5px rgba(255,255,255,.12), 0 24px 70px rgba(0,0,0,.6);
  --st0:rgba(118,118,128,.22); --stt0:#98989d; --st1:rgba(10,132,255,.16); --stt1:#6cb4ff;
  --st2:rgba(10,132,255,.30); --stt2:#a8d1ff; --st3:rgba(10,132,255,.50); --stt3:#ffffff;
  --st4:rgba(10,132,255,.72); --stt4:#ffffff; --st5:rgba(48,209,88,.20); --stt5:#4cd964;
  color-scheme: dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);letter-spacing:-.008em;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;letter-spacing:inherit}
input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:3px solid var(--accent-ring);outline-offset:2px;border-radius:8px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:15px;height:15px}
.num{font-variant-numeric:tabular-nums}
kbd{font:500 11px/1 var(--font);color:var(--ink-3);background:var(--fill-2);border:.5px solid var(--sep-2);border-radius:5px;padding:3px 6px}

/* ───── app shell ───── */
.app{display:grid;grid-template-columns:260px minmax(0,1fr) auto;height:100vh;overflow:hidden;transition:grid-template-columns .35s var(--ease)}
.app.sb-off{grid-template-columns:0 minmax(0,1fr) auto}
.sidebar{background:var(--sidebar);backdrop-filter:saturate(180%) blur(24px);border-right:.5px solid var(--sep-2);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.sb-head{display:flex;align-items:center;gap:10px;padding:16px 14px 10px 16px}
.logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(145deg,#3a8dff,#0058d6);display:grid;place-items:center;box-shadow:0 1px 2px rgba(0,60,160,.35), inset 0 .5px 0 rgba(255,255,255,.35)}
.logo svg{width:15px;height:15px;stroke:#fff;stroke-width:2}
.sb-title{font:650 14px/1 var(--font-display);letter-spacing:-.02em;flex:1;white-space:nowrap}
.sb-search{margin:4px 10px 10px;height:32px;border-radius:9px;background:var(--fill-2);display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--ink-3);font-size:13px;transition:background .2s}
.sb-search:hover{background:var(--fill)}
.sb-search span{flex:1;text-align:left}
.sb-scroll{flex:1;overflow:auto;padding:0 8px 12px}
.sb-label{display:flex;align-items:center;justify-content:space-between;font:600 11.5px/1 var(--font);color:var(--ink-3);padding:16px 8px 6px 10px;letter-spacing:0}
.sb-label .icon-btn{width:22px;height:22px;opacity:0;transition:opacity .15s}
.sb-scroll:hover .sb-label .icon-btn{opacity:1}
.nav-item{width:100%;height:32px;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:8px;color:var(--ink);font-size:13.5px;white-space:nowrap;transition:background .15s}
.nav-item:hover{background:var(--fill-2)}
.nav-item.on{background:var(--accent);color:#fff}
.nav-item.on .badge{color:rgba(255,255,255,.85)}
.nav-item .ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:none}
.nav-item .ic svg{width:15px;height:15px;stroke:#fff;stroke-width:2}
.nav-item .lbl{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.badge.alert{color:var(--red-ink);font-weight:600}
.nav-item.on .badge.alert{color:#fff}
.tree-row{width:100%;height:30px;display:flex;align-items:center;gap:6px;border-radius:7px;color:var(--ink-2);font-size:13.5px;padding-right:8px;white-space:nowrap}
.tree-row:hover{background:var(--fill-2)}
.tree-row.on{background:var(--fill);color:var(--ink);font-weight:550}
.tree-row .tw{width:18px;height:18px;display:grid;place-items:center;color:var(--ink-4);flex:none;border-radius:5px}
.tree-row .tw svg{width:11px;height:11px;stroke-width:2.4;transition:transform .2s var(--ease)}
.tree-row .tw.open svg{transform:rotate(90deg)}
.tree-row .tw:hover{background:var(--fill)}
.tree-row .ty{color:var(--ink-3)} .tree-row .ty svg{width:15px;height:15px}
.tree-row .tl{flex:1;overflow:hidden;text-overflow:ellipsis;text-align:left}
.sb-foot{border-top:.5px solid var(--sep-2);padding:10px 12px;display:flex;align-items:center;gap:6px;color:var(--ink-3);font-size:12px}
.sb-foot .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.sb-foot .grow{flex:1;white-space:nowrap}

.main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.toolbar{height:52px;flex:none;display:flex;align-items:center;gap:6px;padding:0 16px 0 12px;border-bottom:.5px solid transparent;transition:border-color .2s,background .2s;z-index:5}
.toolbar.scrolled{border-color:var(--sep-2);background:var(--glass);backdrop-filter:saturate(180%) blur(20px)}
.crumbs{display:flex;align-items:center;gap:2px;min-width:0;flex:1;font-size:13.5px;color:var(--ink-3)}
.crumbs button{padding:4px 7px;border-radius:6px;white-space:nowrap}
.crumbs button:hover{background:var(--fill-2);color:var(--ink)}
.crumbs .cur{color:var(--ink);font-weight:600}
.crumbs svg{width:11px;height:11px;stroke-width:2.2;color:var(--ink-4)}
.save{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);padding:0 8px;white-space:nowrap}
.save i{width:6px;height:6px;border-radius:50%;background:var(--green);transition:background .2s}
.save.busy i{background:var(--orange);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.icon-btn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--ink-3);transition:background .15s,color .15s;flex:none}
.icon-btn:hover{background:var(--fill-2);color:var(--ink)}
.icon-btn.on{color:var(--accent)}
.content{flex:1;overflow:auto;scroll-behavior:smooth}
.page{max-width:1160px;margin:0 auto;padding:12px clamp(20px,4vw,52px) 120px;animation:enter .42s var(--ease)}
.page.wide{max-width:none}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ───── type ───── */
.eyebrow{font:600 13px/1 var(--font);color:var(--accent-ink);margin:18px 0 10px;letter-spacing:0}
.eyebrow.muted{color:var(--ink-3)}
h1.title{font:700 clamp(28px,3.2vw,36px)/1.1 var(--font-display);letter-spacing:-.028em;margin:0}
.sub{font-size:15px;color:var(--ink-3);margin:10px 0 0;letter-spacing:-.012em}
.sub b{color:var(--ink);font-weight:600} .sub b.r{color:var(--red-ink)}
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.head .grow{flex:1;min-width:260px}
h2.sec{font:650 19px/1.2 var(--font-display);letter-spacing:-.02em;margin:0;display:flex;align-items:center;gap:8px}

/* ───── controls ───── */
.btn{height:32px;display:inline-flex;align-items:center;gap:6px;padding:0 14px;border-radius:9px;background:var(--fill-2);color:var(--ink);font-size:13.5px;font-weight:500;white-space:nowrap;transition:background .15s,transform .1s}
.btn:hover{background:var(--fill)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--accent);color:#fff;box-shadow:0 1px 2px rgba(0,80,180,.25)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{background:none;color:var(--accent-ink)} .btn.ghost:hover{background:var(--accent-soft)}
.btn svg{width:15px;height:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{height:30px;display:inline-flex;align-items:center;gap:6px;padding:0 12px;border-radius:999px;background:var(--fill-2);color:var(--ink-2);font-size:13px;font-weight:500;white-space:nowrap;transition:background .18s,color .18s,transform .1s}
.chip:hover{background:var(--fill)}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--ink);color:var(--bg)}
.chip .n{font-size:12px;opacity:.6;font-variant-numeric:tabular-nums}
.chip .sw{width:8px;height:8px;border-radius:50%}
.chip-group{display:flex;align-items:center;gap:6px}
.chip-group > .k{font-size:12px;color:var(--ink-3);font-weight:600;margin-right:2px;white-space:nowrap}
.vsep{width:1px;height:18px;background:var(--sep-2);margin:0 6px}
.seg{display:inline-flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{height:28px;padding:0 12px;border-radius:7px;font-size:13px;font-weight:500;color:var(--ink-2);white-space:nowrap;transition:background .2s,box-shadow .2s}
.seg button.on{background:var(--raised);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}

/* ───── cards / lists ───── */
.card{background:var(--surface);border-radius:16px;box-shadow:var(--sh-1);overflow:hidden}
.card-h{display:flex;align-items:center;gap:8px;padding:16px 18px 6px}
.card-h h3{margin:0;font:650 15px/1.3 var(--font-display);letter-spacing:-.015em;flex:1}
.card-h .more{font-size:13px;color:var(--accent-ink)}
.card-h .more:hover{text-decoration:underline}
.group-h{display:flex;align-items:baseline;gap:8px;padding:14px 18px 4px;font:650 13px var(--font);color:var(--ink-3)}
.group-h.red{color:var(--red-ink)} .group-h.orange{color:var(--orange-ink)}
.group-h .n{font-weight:500}
.row{position:relative;display:flex;align-items:flex-start;gap:12px;padding:10px 18px;transition:background .15s;cursor:default}
.row:hover{background:var(--fill-2)}
.row.sel{background:var(--accent-soft)}
.row + .row::before{content:"";position:absolute;top:0;left:50px;right:0;height:.5px;background:var(--sep-2)}
.row.sel::before,.row.sel + .row::before{opacity:0}
.check{width:20px;height:20px;margin-top:1px;border-radius:50%;border:1.5px solid var(--ink-4);display:grid;place-items:center;flex:none;transition:background .2s,border-color .2s,transform .12s}
.check:hover{border-color:var(--accent)}
.check:active{transform:scale(.88)}
.check svg{width:12px;height:12px;stroke:#fff;stroke-width:2.6;fill:none;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .3s var(--ease) .05s}
.check.on{background:var(--accent);border-color:var(--accent)}
.check.on svg{stroke-dashoffset:0}
.check.p1{border-color:var(--red)} .check.p2{border-color:var(--orange)}
.row .body{flex:1;min-width:0}
.row .t{font-size:14.5px;line-height:1.4;letter-spacing:-.012em;display:flex;align-items:baseline;gap:6px}
.row .t .pri{font-weight:700;letter-spacing:-.05em}
.row .t .pri.p1{color:var(--red-ink)} .row .t .pri.p2{color:var(--orange-ink)}
.row.done .t{color:var(--ink-4);text-decoration:line-through;text-decoration-color:var(--ink-4)}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:3px;font-size:12.5px;color:var(--ink-3)}
.meta span{display:inline-flex;align-items:center;gap:4px}
.meta svg{width:13px;height:13px}
.meta .lk{color:var(--accent-ink)}
.due{font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink-3);margin-top:1px}
.due.red{color:var(--red-ink);font-weight:600} .due.orange{color:var(--orange-ink);font-weight:600} .due.ink{color:var(--ink-2)}
.pill{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.doing{background:var(--accent-soft);color:var(--accent-ink)}
.pill.hold{background:var(--fill);color:var(--ink-3)}
.pill.warn{background:var(--orange-soft);color:var(--orange-ink)}
.pill.bad{background:var(--red-soft);color:var(--red-ink)}
.pill.ok{background:var(--green-soft);color:var(--green-ink)}
.row .actions{opacity:0;transition:opacity .15s;display:flex;gap:2px;margin:-4px -6px 0 0}
.row:hover .actions{opacity:1}
.row.leaving{animation:leave .45s var(--ease) .35s forwards}
@keyframes leave{to{opacity:0;transform:translateX(12px);height:0;padding-top:0;padding-bottom:0}}

.empty{border:1.5px dashed var(--sep-2);border-radius:14px;padding:28px 20px;text-align:center;color:var(--ink-3)}
.empty b{display:block;color:var(--ink);font-size:15px;font-weight:600;margin-bottom:4px}

/* ───── today ───── */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:24px}
.stat{background:var(--surface);border-radius:18px;padding:16px 18px 15px;box-shadow:var(--sh-1);text-align:left;display:flex;flex-direction:column;gap:12px;transition:transform .2s var(--ease),box-shadow .2s}
.stat:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}
.stat .top{display:flex;align-items:center;justify-content:space-between}
.stat .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center}
.stat .ic svg{width:16px;height:16px;stroke:#fff;stroke-width:2.1}
.stat .n{font:700 30px/1 var(--font-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat .l{font-size:13px;color:var(--ink-3);font-weight:550}
.ring{width:34px;height:34px}
.ring circle{fill:none;stroke-width:4}
.today-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start}
.today-grid > div{display:flex;flex-direction:column;gap:20px}
.jt{padding:4px 18px 16px}
.jt-line{display:flex;align-items:flex-start;gap:10px;padding:6px 0;font-size:14.5px;line-height:1.45;border-radius:8px;position:relative}
.jt-line .bul{width:5px;height:5px;border-radius:50%;background:var(--ink-4);margin:8px 7px 0 8px;flex:none}
.jt-line .check{width:18px;height:18px}
.jt-line.done .tx{color:var(--ink-4);text-decoration:line-through}
.jt-line .tx{flex:1}
.jt-line .promote{opacity:0;font-size:12px;color:var(--accent-ink);white-space:nowrap;padding:2px 8px;border-radius:6px;transition:opacity .15s}
.jt-line:hover .promote{opacity:1}
.jt-line .promote:hover{background:var(--accent-soft)}
.jt-line .lnk{font-size:12px;color:var(--accent-ink);background:var(--accent-soft);padding:1px 7px;border-radius:6px;white-space:nowrap}
.jt-add{display:flex;align-items:center;gap:10px;color:var(--ink-4);font-size:14.5px;padding:6px 0 0 3px}
.jt-add input{border:0;outline:0;background:none;flex:1;padding:4px 0}
.wait-row{display:grid;grid-template-columns:minmax(0,1fr) 92px 54px;align-items:center;gap:12px;padding:9px 18px;font-size:13.5px}
.wait-row + .wait-row{border-top:.5px solid var(--sep)}
.wait-row .who{min-width:0}
.wait-row .who b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wait-row .who small{color:var(--ink-3);font-size:12px}
.bar{height:6px;border-radius:99px;background:var(--fill);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.wait-row .h{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}

/* ───── todos ───── */
.quick{position:relative;margin-bottom:16px}
.quick input{width:100%;height:52px;border-radius:14px;border:0;background:var(--surface);box-shadow:var(--sh-1);padding:0 110px 0 50px;font-size:15.5px;outline:0;transition:box-shadow .2s}
.quick input:focus{box-shadow:0 0 0 4px var(--accent-ring),var(--sh-2)}
.quick input::placeholder{color:var(--ink-4)}
.quick .plus{position:absolute;left:14px;top:14px;width:24px;height:24px;border-radius:50%;background:var(--accent);display:grid;place-items:center}
.quick .plus svg{width:14px;height:14px;stroke:#fff;stroke-width:2.6}
.quick kbd{position:absolute;right:16px;top:17px}
.parsed{display:flex;gap:6px;flex-wrap:wrap;min-height:0;margin:-6px 0 14px 4px;font-size:12.5px;color:var(--ink-3);align-items:center}
.parsed .tok{background:var(--accent-soft);color:var(--accent-ink);border-radius:6px;padding:2px 8px;font-weight:550}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:10px 8px;margin-bottom:18px}
.search-mini{height:30px;display:flex;align-items:center;gap:6px;background:var(--fill-2);border-radius:999px;padding:0 12px;color:var(--ink-3);margin-left:auto}
.search-mini input{border:0;outline:0;background:none;width:130px;font-size:13px;color:var(--ink)}
.done-toggle{display:flex;align-items:center;gap:6px;padding:12px 18px;color:var(--ink-3);font-size:13px;font-weight:550;width:100%}
.done-toggle:hover{color:var(--ink)}
.done-toggle svg{width:11px;height:11px;stroke-width:2.4;transition:transform .2s}
.done-toggle.open svg{transform:rotate(90deg)}

/* ───── inspector ───── */
.inspector{width:0;overflow:hidden;background:var(--surface);border-left:.5px solid var(--sep-2);transition:width .38s var(--ease);height:100vh}
.inspector.open{width:380px}
.insp{width:380px;height:100%;display:flex;flex-direction:column}
.insp-h{display:flex;align-items:flex-start;gap:10px;padding:18px 16px 12px 22px}
.insp-h .grow{flex:1;min-width:0}
.insp-h .k{font-size:12px;color:var(--ink-3);font-weight:600;margin-bottom:4px}
.insp-title{font:650 19px/1.3 var(--font-display);letter-spacing:-.02em;outline:0;border-radius:6px;margin:0}
.insp-title[contenteditable]:focus{box-shadow:0 0 0 3px var(--accent-ring)}
.insp-b{flex:1;overflow:auto;padding:4px 22px 28px}
.field{padding:14px 0;border-top:.5px solid var(--sep-2)}
.field > label,.field > .fl{display:block;font-size:12px;font-weight:600;color:var(--ink-3);margin-bottom:8px}
.field .chips{gap:5px}
.field .chip{height:28px;font-size:12.5px;padding:0 11px}
.field textarea,.field input.txt{width:100%;border:0;background:var(--fill-2);border-radius:10px;padding:10px 12px;outline:0;resize:vertical;font-size:13.5px;line-height:1.5}
.field textarea:focus,.field input.txt:focus{box-shadow:0 0 0 3px var(--accent-ring);background:var(--surface)}
.stage-list{display:flex;flex-direction:column;gap:4px}
.stage-btn{display:flex;align-items:center;gap:10px;height:36px;padding:0 12px;border-radius:10px;font-size:13.5px;text-align:left;transition:background .15s}
.stage-btn:hover{background:var(--fill-2)}
.stage-btn .sw{width:14px;height:14px;border-radius:4px;flex:none}
.stage-btn .grow{flex:1}
.stage-btn .key{font-size:11px;color:var(--ink-4)}
.stage-btn.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.stage-btn.past{color:var(--ink-3)}
.kv{display:grid;grid-template-columns:96px 1fr;gap:10px 12px;align-items:center;font-size:13.5px}
.kv .k{color:var(--ink-3)}
.kv input.txt{padding:7px 10px}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{position:relative;padding:0 0 14px 22px;font-size:13px}
.timeline li::before{content:"";position:absolute;left:4px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--ink-4)}
.timeline li::after{content:"";position:absolute;left:7px;top:16px;bottom:-2px;width:1px;background:var(--sep-2)}
.timeline li:last-child::after{display:none}
.timeline li.cur::before{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.timeline small{display:block;color:var(--ink-3);font-size:12px}
.callout{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;font-size:13px;margin-top:10px}
.callout.warn{background:var(--orange-soft);color:var(--orange-ink)}
.callout.bad{background:var(--red-soft);color:var(--red-ink)}

/* ───── journal ───── */
.jtools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.jnav{display:flex;align-items:center;background:var(--fill-2);border-radius:9px}
.jnav .icon-btn{width:32px;height:32px}
.jgrid{display:grid;background:var(--sep);gap:.5px;border-radius:16px;overflow:hidden;box-shadow:var(--sh-1);min-width:1000px}
.jscroll{overflow-x:auto;padding:2px 2px 8px;margin:0 -2px}
.jh{background:var(--surface-2);padding:12px 14px 10px;font-size:12px;color:var(--ink-3)}
.jh b{display:block;color:var(--ink);font:650 14px var(--font-display);letter-spacing:-.015em}
.jh.cur b{color:var(--accent-ink)}
.jd{background:var(--surface-2);display:grid;place-items:center;font:650 13px var(--font);color:var(--ink-3)}
.jd.we{color:var(--red-ink);opacity:.7}
.jc{background:var(--surface);min-height:148px;padding:10px 12px 12px;position:relative;cursor:text;transition:background .15s}
.jc:hover{background:var(--surface-2)}
.jc.out{background:var(--surface-2)} .jc.out .dn{opacity:.4}
.jc.we{min-height:84px}
.jc .dn{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:12px;font:600 13px var(--font);color:var(--ink-2);margin:-2px 0 4px -4px;padding:0 6px;font-variant-numeric:tabular-nums}
.jc.today{box-shadow:inset 0 0 0 2px var(--accent);background:var(--surface)}
.jc.today .dn{background:var(--accent);color:#fff}
.jc .ln{display:flex;gap:6px;font-size:13px;line-height:1.45;padding:2px 0;color:var(--ink-2)}
.jc .ln .b{width:4px;height:4px;border-radius:50%;background:var(--ink-4);margin:8px 4px 0 2px;flex:none}
.jc .ln .cb{width:13px;height:13px;border-radius:50%;border:1.4px solid var(--ink-4);flex:none;margin-top:3px}
.jc .ln.x .cb{background:var(--accent);border-color:var(--accent)}
.jc .ln.x span{color:var(--ink-4);text-decoration:line-through}
.jc .auto{margin-top:6px;padding-top:6px;border-top:.5px dashed var(--sep-2);display:flex;flex-direction:column;gap:3px}
.jc .auto div{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--orange-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jc .auto div.r{color:var(--red-ink)}
.jc .auto svg{width:12px;height:12px}
.jc .edit{position:absolute;inset:0;padding:38px 12px 12px;border:0;outline:0;resize:none;font-size:13px;line-height:1.55;background:var(--surface);box-shadow:inset 0 0 0 2px var(--accent);border-radius:2px;font-family:var(--font)}

/* ───── note ───── */
.doc{max-width:880px;margin:0 auto}
.doc-title{font:700 clamp(30px,3.4vw,40px)/1.12 var(--font-display);letter-spacing:-.03em;margin:22px 0 8px;outline:0}
.doc-meta{display:flex;gap:14px;align-items:center;font-size:13px;color:var(--ink-3);margin-bottom:22px;flex-wrap:wrap}
.doc-meta span{display:inline-flex;align-items:center;gap:5px}
.fmt{position:sticky;top:8px;z-index:3;display:flex;align-items:center;gap:2px;padding:5px;border-radius:12px;background:var(--glass);backdrop-filter:saturate(180%) blur(20px);box-shadow:var(--sh-2);width:max-content;max-width:100%;overflow-x:auto;margin-bottom:26px}
.fmt .icon-btn{width:30px;height:30px;font-weight:650;font-size:14px;color:var(--ink-2)}
.fmt .icon-btn.on{background:var(--accent-soft);color:var(--accent-ink)}
.fmt .seg{background:var(--fill-2)} .fmt .seg button{height:26px;font-size:12.5px;padding:0 9px}
.fmt .clr{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2)}
.prose{font-size:15.5px;line-height:1.7;letter-spacing:-.011em;color:var(--ink)}
.prose h2{font:650 22px/1.3 var(--font-display);letter-spacing:-.022em;margin:30px 0 8px;display:flex;align-items:center;gap:6px;cursor:default}
.prose h2 .fold{width:20px;height:20px;margin-left:-26px;display:grid;place-items:center;color:var(--ink-4);opacity:0;border-radius:5px;transition:opacity .15s}
.prose h2:hover .fold{opacity:1}
.prose h2 .fold svg{width:12px;height:12px;stroke-width:2.4;transform:rotate(90deg);transition:transform .2s}
.prose h2.closed .fold{opacity:1} .prose h2.closed .fold svg{transform:none}
.prose p{margin:0 0 12px}
.prose mark{background:rgba(255,214,10,.42);color:inherit;border-radius:3px;padding:0 2px}
.prose .c-red{color:var(--red-ink)} .prose .c-blue{color:var(--accent-ink)}
.prose ul.cl{list-style:none;padding:0;margin:0 0 12px}
.prose ul.cl li{display:flex;gap:10px;align-items:flex-start;padding:3px 0}
.prose ul.cl .check{width:18px;height:18px;margin-top:4px}
.prose ul.cl li.x span{color:var(--ink-4);text-decoration:line-through}
.prose code{font:13.5px var(--mono);background:var(--fill-2);padding:2px 6px;border-radius:6px}
.cols{display:grid;grid-template-columns:var(--c1,34%) 14px minmax(0,1fr);margin:16px 0 18px}
.cols .col{background:var(--surface);border-radius:14px;padding:16px 18px;box-shadow:var(--sh-1);min-width:0}
.cols .grip{cursor:col-resize;display:grid;place-items:center}
.cols .grip i{width:4px;height:36px;border-radius:9px;background:var(--fill-3);opacity:0;transition:opacity .2s}
.cols:hover .grip i{opacity:1}
.cols .grip:hover i,.cols.drag .grip i{background:var(--accent);opacity:1}
.cols .col h4{margin:0 0 8px;font:650 13px var(--font);color:var(--ink-3)}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
table.tbl th{text-align:left;font-weight:600;color:var(--ink-3);font-size:12px;padding:6px 10px;border-bottom:.5px solid var(--sep-2)}
table.tbl td{padding:8px 10px;border-bottom:.5px solid var(--sep)}
table.tbl tr:last-child td{border-bottom:0}
table.tbl td:focus{outline:2px solid var(--accent);outline-offset:-2px;border-radius:4px}
.subpages{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:10px}
.subpage{display:flex;gap:12px;align-items:center;padding:14px 16px;background:var(--surface);border-radius:14px;box-shadow:var(--sh-1);text-align:left;transition:transform .2s var(--ease),box-shadow .2s}
.subpage:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}
.subpage .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none}
.subpage .ic svg{stroke:#fff;width:17px;height:17px;stroke-width:2}
.subpage b{display:block;font-size:14px;font-weight:600}
.subpage small{color:var(--ink-3);font-size:12px}

/* ───── html page ───── */
.frame{background:var(--surface);border-radius:18px;box-shadow:var(--sh-2);overflow:hidden}
.frame-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:.5px solid var(--sep-2);font-size:12.5px;color:var(--ink-3)}
.frame-bar .grow{flex:1}
.lecture{padding:34px clamp(20px,5vw,56px) 40px;background:linear-gradient(180deg,var(--surface),var(--surface-2))}
.lecture h3{font:700 26px/1.2 var(--font-display);letter-spacing:-.025em;margin:0 0 6px}
.lecture p{color:var(--ink-2);max-width:640px;margin:0 0 20px;font-size:15px}
.plot{background:var(--surface);border-radius:14px;box-shadow:var(--sh-1);padding:16px}
.plot svg{width:100%;height:220px;display:block}
.slider{display:flex;align-items:center;gap:14px;margin-top:14px;font-size:13px;color:var(--ink-3)}
.slider input{flex:1;accent-color:var(--accent)}

/* ───── board ───── */
.prog{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--fill);gap:2px}
.prog i{display:block;height:100%;transition:flex .5s var(--ease)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:12.5px;color:var(--ink-3)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px}
.legend b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.board-card{padding:18px 18px 20px;margin-bottom:18px}
.bstat{display:flex;gap:28px;flex-wrap:wrap;margin-bottom:16px}
.bstat div{display:flex;flex-direction:column}
.bstat .n{font:700 24px/1.1 var(--font-display);letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.bstat .l{font-size:12.5px;color:var(--ink-3)}
.bstat .n.r{color:var(--red-ink)} .bstat .n.o{color:var(--orange-ink)}
.bwrap{overflow:auto;background:var(--surface);border-radius:16px;box-shadow:var(--sh-1);padding:6px 10px 12px}
table.matrix{border-collapse:separate;border-spacing:5px;min-width:100%;user-select:none}
.matrix th{font-weight:500;text-align:left;vertical-align:bottom;padding:10px 4px 6px;position:sticky;top:0;background:var(--surface);z-index:2}
.matrix th .eq{font:650 13.5px var(--font);color:var(--ink);letter-spacing:-.01em}
.matrix th .vd{font-size:11.5px;color:var(--ink-3)}
.matrix th .mini{height:4px;border-radius:9px;background:var(--fill);margin-top:7px;overflow:hidden}
.matrix th .mini i{display:block;height:100%;background:var(--green);border-radius:9px}
.matrix th.colsel .eq{color:var(--accent-ink)}
.matrix td.lot{vertical-align:top;padding:8px 10px 0 2px;white-space:nowrap;position:sticky;left:0;background:var(--surface);z-index:1}
.matrix td.lot b{font:650 13px var(--font);letter-spacing:-.01em;display:block}
.matrix td.lot .pill{margin-top:5px}
.matrix td.wf{font-size:12px;color:var(--ink-3);padding:0 6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.matrix tr.gap td{height:6px;padding:0}
.tile{position:relative;width:100%;min-width:112px;height:48px;border-radius:10px;padding:6px 10px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;text-align:left;font-size:12.5px;line-height:1.25;transition:transform .12s,box-shadow .15s,filter .15s}
.tile:hover{filter:brightness(.97);transform:translateY(-1px)}
.tile b{font-weight:600;white-space:nowrap}
.tile small{font-size:11.5px;opacity:.8;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile .wd{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;box-shadow:0 0 0 2px var(--surface)}
.tile.sel{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.tile.x{background:repeating-linear-gradient(135deg,var(--fill-2) 0 6px,transparent 6px 12px);color:var(--ink-4);cursor:default}
.tile.x:hover{transform:none;filter:none}
.tile.dim{opacity:.22}
.s0{background:var(--st0);color:var(--stt0)} .s1{background:var(--st1);color:var(--stt1)} .s2{background:var(--st2);color:var(--stt2)}
.s3{background:var(--st3);color:var(--stt3)} .s4{background:var(--st4);color:var(--stt4)} .s5{background:var(--st5);color:var(--stt5)}
.selbar{position:absolute;left:50%;bottom:24px;transform:translate(-50%,140%);display:flex;align-items:center;gap:6px;padding:7px 8px 7px 16px;border-radius:16px;background:var(--glass);backdrop-filter:saturate(180%) blur(24px);box-shadow:var(--sh-3);transition:transform .38s var(--spring);z-index:20;max-width:calc(100% - 32px);overflow-x:auto}
.selbar.show{transform:translate(-50%,0)}
.selbar .cnt{font-weight:650;font-size:13.5px;white-space:nowrap;margin-right:6px}
.selbar .st{height:32px;display:inline-flex;align-items:center;gap:6px;padding:0 11px;border-radius:9px;font-size:12.5px;font-weight:550;white-space:nowrap}
.selbar .st:hover{background:var(--fill)}
.selbar .st i{width:10px;height:10px;border-radius:3px}

/* ───── palette / toast ───── */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.18);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.scrim.show{opacity:1;pointer-events:auto}
.palette{position:fixed;left:50%;top:13vh;width:min(640px,calc(100vw - 32px));transform:translate(-50%,-8px) scale(.98);opacity:0;pointer-events:none;background:var(--raised);border-radius:18px;box-shadow:var(--sh-3);overflow:hidden;transition:opacity .2s,transform .25s var(--ease);z-index:51}
.palette.show{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}
.palette .in{display:flex;align-items:center;gap:12px;padding:0 18px;height:58px;border-bottom:.5px solid var(--sep-2);color:var(--ink-3)}
.palette input{flex:1;border:0;outline:0;background:none;font-size:18px;color:var(--ink);letter-spacing:-.015em}
.palette .res{max-height:min(420px,56vh);overflow:auto;padding:6px}
.palette .gl{font-size:11.5px;font-weight:600;color:var(--ink-3);padding:10px 12px 4px}
.palette .it{width:100%;display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:10px;font-size:14px;text-align:left}
.palette .it .ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:none;background:var(--fill-2);color:var(--ink-2)}
.palette .it .ic svg{width:15px;height:15px}
.palette .it .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.palette .it small{color:var(--ink-3);font-size:12px}
.palette .it.on{background:var(--accent);color:#fff}
.palette .it.on small,.palette .it.on .ic{color:#fff} .palette .it.on .ic{background:rgba(255,255,255,.2)}
.palette .foot{display:flex;gap:16px;padding:9px 16px;border-top:.5px solid var(--sep-2);font-size:12px;color:var(--ink-3)}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,160%);display:flex;align-items:center;gap:14px;padding:10px 10px 10px 18px;border-radius:14px;background:#1d1d1f;color:#f5f5f7;font-size:13.5px;box-shadow:var(--sh-3);transition:transform .4s var(--spring);z-index:60}
:root[data-theme="dark"] .toast{background:#3a3a3c}
.toast.show{transform:translate(-50%,0)}
.toast button{color:#4da3ff;font-weight:600;padding:5px 10px;border-radius:8px}
.toast button:hover{background:rgba(255,255,255,.1)}

/* ───── skeleton & responsive ───── */
@media (max-width:1180px){
  .today-grid{grid-template-columns:1fr}
  .inspector.open{position:absolute;right:0;top:0;bottom:0;box-shadow:var(--sh-3);z-index:30}
}
@media (max-width:900px){
  .app{grid-template-columns:0 minmax(0,1fr) auto}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cols{grid-template-columns:1fr} .cols .grip{display:none} .cols .col + .col{margin-top:12px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

/* board: stage master (SPEC 4.3) */
const STAGES = [
  {l:'검사대기', s:'검사대기', warn:24},
  {l:'검사완료', s:'검사완료', warn:12},

  {l:'정리완료', s:'정리완료', warn:0},
];
const EQS = [
  {id:'EQ-A01', v:'A사'}, {id:'EQ-A02', v:'A사'}, {id:'EQ-B01', v:'B사'}, {id:'EQ-B02', v:'B사'}, {id:'EQ-C01', v:'C사'},
];
const LOTS = [
  {id:'LOT-TEST-001', mos:['MI 완료','ok']}, {id:'LOT-TEST-002', mos:['MI 진행','doing']},
  {id:'LOT-TEST-003', mos:['Hold','warn']}, {id:'LOT-TEST-004', mos:['도착 전','hold']},
];
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const CELLS = {};
LOTS.forEach((lot, li) => [1,2,3].forEach(w => EQS.forEach((eq, ei) => {
  const key = `${lot.id}|${w}|${eq.id}`;
  if (li === 3 && w === 3 && ei === 4) { CELLS[key] = null; return; }
  const base = [5.2, 3.3, 2, 0.2][li];
  const st = Math.max(0, Math.min(5, Math.round(base + (rnd() * 2 - 1.1))));
  const outlier = (li === 2 && w === 2 && ei === 3) || (li === 1 && w === 1 && ei === 1);
  const wait = st === 5 ? 0 : Math.round((2 + rnd() * (STAGES[st].warn || 24) * 1.15) * (outlier ? 2.6 : 1));
  CELLS[key] = {lot:lot.id, w, eq:eq.id, st, wait,
    rep: st >= 3 ? (rnd() > .15 ? 'OK' : 'NG') : null,
    scan: st >= 1 ? (38 + Math.round(rnd() * 14)) : null,
    defects: st >= 2 ? Math.round(120 + rnd() * 900) : null,
    cls: st >= 4, issue: (li === 2 && w === 2 && ei === 3) ? '포커스 오프셋 의심, 재검사 필요' : ''};
})));
const cellList = () => Object.values(CELLS).filter(Boolean);
const waitLevel = c => { const wh = STAGES[c.st].warn; if (!wh || !c.wait) return 0; return c.wait > wh * 2 ? 2 : c.wait > wh ? 1 : 0; };

/* ════════════ state ════════════ */

/* ════════════ shell ════════════ */
const NAV = [
  {v:'today', t:'오늘', icon:'sun', color:'#ff9500'},
  {v:'todos', t:'할일', icon:'checklist', color:'#0071e3', badge:() => {
    const open = TODOS.filter(t => t.status !== 'done'); const od = open.filter(t => t.due && dayDiff(t.due) < 0).length;

  {v:'journal', t:'월간 일지', icon:'calendar', color:'#ff3b30', page:'j2611'},
  {v:'board', t:'평가 현황판', icon:'grid', color:'#5856d6', page:'ev26'},

function renderNav(){
  $('#nav').innerHTML = NAV.map(n => `<button class="nav-item ${S.view===n.v && (!n.page || S.page===n.page)?'on':''}" onclick="go('${n.v}'${n.page?`,'${n.page}'`:''})">
    <span class="ic" style="background:${n.color}">${ic(n.icon)}</span><span class="lbl">${n.t}</span>${n.badge?n.badge():''}</button>`).join('');
}
function treeHTML(nodes, depth){
  return nodes.map(n => {
    const has = n.kids && n.kids.length;
    return `<div role="treeitem" aria-expanded="${has?!!n.open:''}">
      <button class="tree-row ${S.page===n.id?'on':''}" style="padding-left:${4+depth*14}px" onclick="openNode('${n.id}')" ondblclick="toggleNode(event,'${n.id}')" title="${esc(n.t)}">
        <span class="tw ${n.open?'open':''}" onclick="toggleNode(event,'${n.id}')" style="${has?'':'visibility:hidden'}">${ic('chev')}</span>
        <span class="ty" style="color:${n.ty==='note'&&has?'var(--ink-3)':TYPE[n.ty].color}">${ic(n.ty==='note'&&has?'folder':TYPE[n.ty].icon,'i sm')}</span>
        <span class="tl">${esc(n.t)}</span>
      </button>${has && n.open ? treeHTML(n.kids, depth+1) : ''}</div>`;
  }).join('');
}
function renderTree(){ $('#tree').innerHTML = treeHTML(TREE, 0); }
const findNode = (id, nodes=TREE, path=[]) => { for (const n of nodes){ const p=[...path,n]; if(n.id===id) return p; if(n.kids){ const r=findNode(id,n.kids,p); if(r) return r; } } return null; };
function toggleNode(e, id){ e.stopPropagation(); const p = findNode(id); const n = p[p.length-1]; if (n.kids){ n.open = !n.open; renderTree(); } }
function openNode(id){ const p = findNode(id); const n = p[p.length-1]; go(n.view || 'note', id); }

function crumbs(parts){

}
function actions(html){ $('#tbActions').innerHTML = html; }

const VIEWS = {};
function go(v, page=null){
  S.view = v; S.page = page; S.sel.clear(); closeInspector(true);

  const c = $('#content'); c.scrollTop = 0; $('#toolbar').classList.remove('scrolled');
  VIEWS[v](c);
  renderSelbar();
}
$('#content').addEventListener('scroll', e => $('#toolbar').classList.toggle('scrolled', e.target.scrollTop > 4));

function toggleSidebar(){ const a = $('#app'); a.classList.toggle('sb-off'); $('#sbOpen').style.display = a.classList.contains('sb-off') ? '' : 'none'; }
function cycleTheme(){
  const r = document.documentElement; const cur = r.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  r.dataset.theme = cur === 'dark' ? 'light' : 'dark';

function editCell(cell){
  if (cell.querySelector('textarea')) return;
  const k = cell.dataset.k; const ta = document.createElement('textarea'); ta.className = 'edit'; ta.value = JOURNAL[k] || ''; ta.placeholder = '- [ ] 할 일\n- 메모';
  cell.appendChild(ta); ta.focus();
  ta.oninput = () => { JOURNAL[k] = ta.value; flashSave(); };
  ta.onkeydown = e => { if (e.key === 'Escape') ta.blur(); };
  ta.onblur = () => VIEWS.journal($('#content'));
}

function dragCols(e){
  const cols = $('#cols'); const r = cols.getBoundingClientRect(); cols.classList.add('drag');

  const up = () => { cols.classList.remove('drag'); removeEventListener('pointermove', mv); removeEventListener('pointerup', up); flashSave(); };

}

  $('#diff').innerHTML = `<line x1="0" y1="205" x2="600" y2="205" stroke="var(--sep-2)"/><path d="${d} L600,205 L0,205Z" fill="var(--accent-soft)"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.2" vector-effect="non-scaling-stroke"/>`;
}

function renderBoardSummary(){

      <div><span class="n r">${w2}</span><span class="l">2배 초과</span></div>
      <div><span class="n">D-9</span><span class="l">평가 마감 12월 3일</span></div></div>

    <div class="legend">${STAGES.map((s,i) => `<span><i class="s${i}"></i>${s.l} <b>${by[i]}</b></span>`).join('')}</div>`;

function tileHTML(x){
  if (!x) return `<div class="tile x" title="제외된 조합"><small>제외</small></div>`;
  const key = `${x.lot}|${x.w}|${x.eq}`; const wl = waitLevel(x);
  const dim = (S.bOnlyLeft && x.st === 5) || (S.bWarn && !wl);
  const sel = S.sel.has(key) || (S.insp && S.insp.kind === 'cell' && S.insp.key === key);
  const sub = S.bValues ? [x.rep, x.scan!=null?`${x.scan}분`:null, x.defects!=null?`${x.defects}개`:null].filter(Boolean).join(' · ') || '—'
    : x.st === 5 ? '' : `${x.wait}시간째`;
  return `<button class="tile s${x.st} ${sel?'sel':''} ${dim?'dim':''}" data-key="${key}" onclick="cellClick(event,'${key}')" aria-label="${x.lot} W${x.w} ${x.eq} ${STAGES[x.st].l}">
    <b>${STAGES[x.st].s}</b><small>${sub}</small>${wl?`<span class="wd" style="background:${wl===2?'var(--red)':'var(--orange)'}"></span>`:''}${x.issue?`<span class="wd" style="background:var(--red);right:${wl?19:7}px;border-radius:2px;transform:rotate(45deg)"></span>`:''}</button>`;
}
function renderBoardMatrix(){
  const m = $('#matrix'); if (!m) return; let h = '';
  const eqDone = eq => { const l = cellList().filter(x => x.eq === eq); return Math.round(l.filter(x => x.st === 5).length / l.length * 100); };
  if (S.bView === 'lot'){
    h += `<thead><tr><th style="left:0;z-index:3">Lot</th><th></th>${EQS.map(e => `<th><div class="eq">${e.id}</div><div class="vd">${e.v} · ${eqDone(e.id)}%</div><div class="mini"><i style="width:${eqDone(e.id)}%"></i></div></th>`).join('')}</tr></thead><tbody>`;
    LOTS.forEach((lot, li) => {
      if (li) h += `<tr class="gap"><td colspan="${EQS.length+2}"></td></tr>`;
      [1,2,3].forEach(w => {
        h += `<tr>${w===1?`<td class="lot" rowspan="3"><b>${lot.id}</b><span class="pill ${lot.mos[1]}" title="MOS 최신 상태">${lot.mos[0]}</span></td>`:''}<td class="wf">W${w}</td>`;
        EQS.forEach(e => h += `<td>${tileHTML(CELLS[`${lot.id}|${w}|${e.id}`])}</td>`);
        h += `</tr>`;
      });
    });
  } else {
    h += `<thead><tr><th style="left:0;z-index:3">설비</th>${LOTS.map(l => [1,2,3].map(w => `<th><div class="eq" style="font-size:12px">${l.id.replace('LOT-TEST-','')}·W${w}</div></th>`).join('')).join('')}</tr></thead><tbody>`;
    EQS.forEach(e => {
      h += `<tr><td class="lot"><b>${e.id}</b><span class="vd" style="font-size:12px;color:var(--ink-3)">${e.v} · ${eqDone(e.id)}%</span></td>`;
      LOTS.forEach(l => [1,2,3].forEach(w => h += `<td>${tileHTML(CELLS[`${l.id}|${w}|${e.id}`])}</td>`));
      h += `</tr>`;
    });
  }
  m.innerHTML = h + '</tbody>';
}
function cellClick(e, key){
  if (e.shiftKey || e.ctrlKey || e.metaKey || S.sel.size){
    if (S.insp && S.insp.kind === 'cell' && !S.sel.size) S.sel.add(S.insp.key);
    S.sel.has(key) ? S.sel.delete(key) : S.sel.add(key);
    closeInspector(true); renderBoardMatrix(); renderSelbar(); return;
  }
  openCell(key);
}
function renderSelbar(){
  const b = $('#selbar');
  if (!S.sel.size || S.view !== 'board'){ b.classList.remove('show'); return; }
  b.innerHTML = `<span class="cnt">${S.sel.size}칸 선택</span><span class="vsep"></span>${STAGES.map((s,i) => `<button class="st" onclick="bulkStage(${i})"><i class="s${i}"></i>${s.s}</button>`).join('')}<span class="vsep"></span><button class="icon-btn" title="선택 해제 (Esc)" onclick="S.sel.clear();renderBoardMatrix();renderSelbar()">${ic('x')}</button>`;
  b.classList.add('show');
}
function bulkStage(i){
  const keys = [...S.sel]; const prev = keys.map(k => [k, CELLS[k].st, CELLS[k].wait]);
  keys.forEach(k => { CELLS[k].st = i; CELLS[k].wait = 0; });
  S.sel.clear(); flashSave(); renderBoardSummary(); renderBoardMatrix(); renderSelbar();
  toast(`${keys.length}칸 → ${STAGES[i].l}`, () => { prev.forEach(([k,s,w]) => { CELLS[k].st = s; CELLS[k].wait = w; }); renderBoardSummary(); renderBoardMatrix(); });
}
function openCell(key){
  const x = CELLS[key]; S.insp = {kind:'cell', key}; renderBoardMatrix();
  const wl = waitLevel(x); const wh = STAGES[x.st].warn;
  const okng = v => `<div class="chips">${['OK','NG'].map(o => `<button class="chip ${x.rep===o?'on':''}" onclick="CELLS['${key}'].rep=${x.rep===o?'null':`'${o}'`};flashSave();openCell('${key}')">${o}</button>`).join('')}</div>`;
  const hist = []; let h = x.wait; for (let i = x.st; i >= 0 && hist.length < 4; i--){ hist.push({s:STAGES[i].l, t: i===x.st ? `${h}시간 전` : `${h + (x.st - i) * 19}시간 전`, cur:i===x.st}); }
  openInspector(`<div class="insp">
    <div class="insp-h"><div class="grow"><div class="k">${x.eq} · ${EQS.find(e=>e.id===x.eq).v}</div><h2 class="insp-title">${x.lot} · W${x.w}</h2></div>
      <button class="icon-btn" title="닫기 (Esc)" onclick="closeInspector()">${ic('x')}</button></div>
    <div class="insp-b">
      ${wl?`<div class="callout ${wl===2?'bad':'warn'}" style="margin:0 0 14px">${ic('hourglass','i sm')}<span><b>${STAGES[x.st].l}</b>에서 ${x.wait}시간째 — 기준 ${wh}시간${wl===2?'의 2배를 넘었어요':'을 넘었어요'}.</span></div>`:''}
      <div class="field" style="border-top:0;padding-top:0"><span class="fl">단계 <span style="font-weight:400">· 숫자키 1–6</span></span><div class="stage-list">
        ${STAGES.map((s,i) => `<button class="stage-btn ${i===x.st?'on':''} ${i<x.st?'past':''}" onclick="setStage('${key}',${i})"><span class="sw s${i}"></span><span class="grow">${s.l}</span>${i<x.st?ic('tick','i sm'):''}<span class="key">${i+1}</span></button>`).join('')}
      </div></div>
      <div class="field"><span class="fl">값</span><div class="kv">
        <span class="k">반복도</span>${okng()}
        <span class="k">scan time</span><input class="txt num" value="${x.scan??''}" placeholder="분" oninput="flashSave()">
        <span class="k">디펙 모수</span><input class="txt num" value="${x.defects??''}" placeholder="개" oninput="flashSave()">
        <span class="k">분류 완료</span><div><button class="check ${x.cls?'on':''}" onclick="this.classList.toggle('on');CELLS['${key}'].cls=!CELLS['${key}'].cls;flashSave()"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button></div>
      </div></div>
      <div class="field"><label>이슈 · 메모</label><textarea rows="3" placeholder="이슈가 있으면 적어 두세요" oninput="CELLS['${key}'].issue=this.value;flashSave()">${esc(x.issue)}</textarea></div>
      <div class="field"><span class="fl">이력</span><ul class="timeline">${hist.map(e => `<li class="${e.cur?'cur':''}">${e.s}<small>${e.t}</small></li>`).join('')}</ul></div>
    </div></div>`);
}
function setStage(key, i){
  const x = CELLS[key]; if (x.st === i) return; const p = [x.st, x.wait]; x.st = i; x.wait = 0; flashSave(); renderBoardSummary(); openCell(key);
  toast(`${STAGES[i].l}(으)로 바꿨어요`, () => { x.st = p[0]; x.wait = p[1]; renderBoardSummary(); openCell(key); });
}

/* ════════════ palette ════════════ */
let PAL = [], palIdx = 0;
function palItems(q){
  const items = [];
  const walk = (ns, trail) => ns.forEach(n => { items.push({g:'페이지', t:n.t, sub:trail.join(' › '), icon:TYPE[n.ty].icon, run:() => openNode(n.id)}); if (n.kids) walk(n.kids, [...trail, n.t]); });
  walk(TREE, []);
  TODOS.filter(t => t.status !== 'done').forEach(t => items.push({g:'할일', t:t.title, sub:dueInfo(t.due)?.t || '', icon:'checklist', run:() => { go('todos'); setTimeout(() => openTodo(t.id), 50); }}));
  [['새 할일', 'plus', () => { go('todos'); setTimeout(() => $('#qa').focus(), 60); }, 'N'],
   ['오늘로 이동', 'sun', () => go('today'), ''], ['평가 현황판 열기', 'grid', () => go('board'), ''],
   ['화면 모드 바꾸기', 'moon', cycleTheme, ''], ['사이드바 보이기/숨기기', 'sidebar', toggleSidebar, 'Ctrl+\\']].forEach(([t, icon, run, k]) => items.push({g:'명령', t, icon, run, sub:k}));
  const s = q.trim().toLowerCase();
  return s ? items.filter(i => (i.t + ' ' + (i.sub||'')).toLowerCase().includes(s)) : items.filter(i => i.g === '명령' || ['j2611','ev26','evm','opt'].some(id => findNode(id).slice(-1)[0].t === i.t));
}
function renderPal(){
  PAL = palItems($('#pq').value); palIdx = Math.min(palIdx, Math.max(0, PAL.length - 1)); let g = '', h = '';
  PAL.forEach((it, i) => { if (it.g !== g){ g = it.g; h += `<div class="gl">${g}</div>`; } h += `<button class="it ${i===palIdx?'on':''}" onmouseenter="palIdx=${i};renderPal()" onclick="palRun(${i})"><span class="ic">${ic(it.icon)}</span><span class="grow">${esc(it.t)}</span><small>${esc(it.sub||'')}</small></button>`; });
  $('#pres').innerHTML = h || `<div class="empty" style="margin:10px"><b>결과가 없어요</b>다른 단어로 찾아보세요.</div>`;
  $('#pres .it.on')?.scrollIntoView({block:'nearest'});
}
function openPalette(){ $('#scrim').classList.add('show'); $('#palette').classList.add('show'); $('#pq').value = ''; palIdx = 0; renderPal(); setTimeout(() => $('#pq').focus(), 30); }
function closePalette(){ $('#scrim').classList.remove('show'); $('#palette').classList.remove('show'); }
function palRun(i){ const it = PAL[i]; closePalette(); it && it.run(); }
$('#pq').addEventListener('input', () => { palIdx = 0; renderPal(); });
$('#pq').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown'){ palIdx = Math.min(PAL.length - 1, palIdx + 1); renderPal(); e.preventDefault(); }
  if (e.key === 'ArrowUp'){ palIdx = Math.max(0, palIdx - 1); renderPal(); e.preventDefault(); }
  if (e.key === 'Enter') palRun(palIdx);
});

/* ════════════ keyboard ════════════ */
addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName) || document.activeElement.isContentEditable;
  if (e.key === 'Escape'){
    if ($('#palette').classList.contains('show')) return closePalette();
    if (typing) return document.activeElement.blur();
    if (S.sel.size){ S.sel.clear(); renderBoardMatrix(); return renderSelbar(); }
    if (S.insp) return closeInspector();
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); return openPalette(); }
  if ((e.ctrlKey || e.metaKey) && e.key === '\\'){ e.preventDefault(); return toggleSidebar(); }
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === '/'){ e.preventDefault(); openPalette(); }
  else if (e.key === 'n' || e.key === 'N' || e.key === 'ㅜ'){ e.preventDefault(); if (S.view !== 'todos') go('todos'); setTimeout(() => $('#qa').focus(), 40); }
  else if (S.view === 'board' && S.insp && S.insp.kind === 'cell' && /^[1-6]$/.test(e.key)) setStage(S.insp.key, +e.key - 1);
});

go('today');
</script>
