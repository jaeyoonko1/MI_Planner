function renderJournal(){const first=dayDate(monthStart()),offset=(first.getUTCDay()+6)%7,start=addDays(monthStart(),-offset);const last=new Date(Date.UTC(first.getUTCFullYear(),first.getUTCMonth()+1,0,12)),weeks=Math.ceil((offset+last.getUTCDate())/7);const [year,mon]=month.split('-');let matrix='<div role="row" class="matrix-row"><div class="matrix-head" role="columnheader">요일</div>';for(let w=0;w<weeks;w++){const s=addDays(start,w*7),e=addDays(s,6);matrix+=`<div class="matrix-head ${TODAY>=s&&TODAY<=e?'current':''}" role="columnheader"><strong>${w+1}주</strong><small class="mono">${s.slice(5).replace('-','.')} — ${e.slice(5).replace('-','.')}</small></div>`}matrix+='</div>';for(let row=0;row<(weekends?7:5);row++){matrix+=`<div role="row" class="matrix-row"><div class="weekday" role="rowheader">${['월','화','수','목','금','토','일'][row]}</div>`;for(let w=0;w<weeks;w++){const d=addDays(start,w*7+row),inMonth=d.startsWith(month),due=autoShow?dateTasks(d):[],notes=journalText(d).replace(/!\[이미지\]\(mi-image:\d+@(?:auto|\d+)\)/g,'첨부 이미지').replace(/^- \[x\]/gim,'✓').replace(/^- \[ \]/gm,'□').replace(/^- /gm,'· ');matrix+=`<button class="day-cell ${!inMonth?'outside':''} ${d===TODAY?'today':''}" ${inMonth?`data-day="${d}"`:'disabled'} role="gridcell" aria-label="${dateLabel(d)}${d===TODAY?' 오늘':''}, ${journals[d]?'기록 있음':'기록 없음'}${due.length?`, 납기 할일 ${due.length}개`:''}"><span class="day-top"><b>${Number(d.slice(8))}</b>${d===TODAY?'<span class="today-tag">오늘</span>':''}</span>${inMonth&&notes?`<span class="day-note">${esc(notes)}</span>`:''}${inMonth&&due.length?`<span class="day-auto ${dayDiff(d)<0?'red':''}">${icon('link')}할일 ${due.length} · ${esc(due[0].title)}</span>`:''}</button>`}matrix+='</div>'}main.innerHTML=`<div class="page">${head('흩어진 기록을 하나의 흐름으로','월간 일지','가로는 주차, 세로는 요일. 한 달의 업무를 한눈에 읽습니다.','<span class="pill blue">주차 × 요일</span>')}<div class="journal-tools"><div class="month-picker"><button class="icon-btn" id="prev-month" aria-label="이전 달">${icon('left')}</but function calculate(){const raw=document.getElementById('measurements').value.trim().split(/[,\s]+/),numeric=/^[+-]?(?:\d+\.?\d*|\.\d+)(?:[eE][+-]?\d+)?$/;const values=raw.map(Number),target=document.getElementById('calc-results');if(raw.length<2||raw.length>10000||raw.some(x=>!numeric.test(x))||values.some(x=>!Number.isFinite(x))){target.innerHTML='<p class="pill red">유효한 숫자를 2개 이상, 10,000개 이하로 입력하세요.</p>';return}let mean=0,m2=0,n=0;for(const value of values){n++;const delta=value-mean;mean+=delta/n;m2+=delta*(value-mean)}const s=Math.sqrt(Math.max(0,m2/(n-1)));if(![mean,s].every(Number.isFinite)){target.innerHTML='<p class="pill red">계산 범위를 벗어났습니다. 값의 크기를 확인하세요.</p>';return}const fmt=x=>Number(x.toPrecision(7)).toLocaleString('en-US',{maximumSignificantDigits:7});target.innerHTML=`<table class="note-table"><tbody><tr><th>측정 수 n</th><td class="mono">${n}</td></tr><tr><th>평균 x̄</th><td class="mono">${fmt(mean)}</td></tr><tr><th>표본표준편차 s</th><td class="mono" style="color:var(--cyan)">${fmt(s)}</td></tr><tr><th>평균의 표준불확도 u(x̄)</th><td class="mono" style="color:var(--violet)">${fmt(s/Math.sqrt(n))}</td></tr></tbody></table>`}

// A view is an ordered list of grouping fields. Issues keep their identity in every view.
let levels=['epic','kind'], closedGroups=new Set(), selection='', editingLevels=false, rowMap=new Map(), viewDrag=null;

const issueKey=t=>'i'+t.id;
const namedKey=(parent,key,val)=>JSON.stringify([parent,key,val]);
function buildRows(){
  const rows=[];
  function walk(items,depth,parent,props){
    if(depth===levels.length){
      for(const t of items)rows.push({id:issueKey(t),parent,depth,t,props,items:[t]});
      return;
    }
    const k=levels[depth], grouped=new Map();
    for(const t of items){const v=valueOf(t,k);if(!grouped.has(v))grouped.set(v,[]);grouped.get(v).push(t)}
    for(const [v,sub] of grouped){
      const id=namedKey(parent,k,v),ctx={...props,[k]:v};
      rows.push({id,parent,depth,k,v,items:sub,props:ctx});walk(sub,depth+1,id,ctx);
    }
  }
  walk(tasks,0,'',{});return rows;
}
function startFree(){
  freeTree=new Map(buildRows().map(r=>[r.id,{id:r.id,parent:r.parent,k:r.k,v:r.v,taskId:r.t?.id}]));

}
function freeRows(){
  for(const t of tasks)if(!freeTree.has(issueKey(t)))freeTree.set(issueKey(t),{id:issueKey(t),parent:'',taskId:t.id});
  const rows=[],children=new Map(),byTask=new Map(tasks.map(t=>[t.id,t]));
  for(const n of freeTree.values()){if(n.taskId&&!byTask.has(n.taskId))continue;if(!children.has(n.parent))children.set(n.parent,[]);children.get(n.parent).push(n)}
  function walk(parent,depth,ctx){
    const childrenTasks=[];
    for(const n of children.get(parent)||[]){
      const t=byTask.get(n.taskId),props=n.k?{...ctx,[n.k]:n.v}:ctx,r={...n,depth,props,t,items:[]};rows.push(r);
      r.items=t?[t]:walk(n.id,depth+1,props);childrenTasks.push(...r.items);
    }
    return childrenTasks;
  }
  walk('',0,{});return rows;
}

  const i=levels.indexOf(from),j=levels.indexOf(to);if(i<0||j<0||i===j)return;
  levels.splice(j,0,levels.splice(i,1)[0]);closedGroups.clear();selection='';render();
}

    if(!name)return;if(!validName(name)||groupValues(r.k).includes(name)){toast('새 이름을 입력하세요.');return}
    choices[r.k].push(name);

    }else{
      const contents=r.k==='epic'?tasks.filter(t=>valueOf(t,'epic')===r.v):r.items;
      for(const t of contents.slice())copyIssue(t,{[r.k]:name},false);
      selection=namedKey(r.parent,r.k,name);
    }
    toast('하위 이슈를 독립된 복사본으로 만들었습니다.');
  }
  render();
}
function placeRow(source,target,before=false){
  if(!source||!target||source.id===target.id)return;
  if(freeMode){
    const parent=target.t||before?target.parent:target.id;
    for(let id=parent;id;id=freeTree.get(id)?.parent)if(id===source.id){toast('자기 하위로 이동할 수 없습니다.');return}
    const node=freeTree.get(source.id);node.parent=parent;
    if(before||target.t){const entries=[...freeTree].filter(([id])=>id!==node.id);entries.splice(entries.findIndex(([id])=>id===target.id),0,[node.id,node]);freeTree=new Map(entries)}
    else{freeTree.delete(node.id);freeTree.set(node.id,node)}
    const moved=new Set(source.items);for(const row of freeRows().filter(r=>r.t&&moved.has(r.t)))Object.assign(row.t,row.props);
  }else{
    if(!source.t||target.t)return;
    Object.assign(source.t,target.props);
  }
  closedGroups.delete(target.id);selection=source.id;render();
}
const attr=value=>esc(String(value));
function strata(){
  levels=levels.filter(k=>groupKeys().includes(k));
  const rows=freeMode?freeRows():buildRows();rowMap=new Map(rows.map(r=>[r.id,r]));
  const selected=rowMap.get(selection),hidden=new Set();
  const displayed=rows.filter(r=>{if(hidden.has(r.parent)||closedGroups.has(r.parent)){hidden.add(r.id);return false}return true});
  const groups=rows.filter(r=>!r.t);
  function tableRow(r){
    const t=r.t,n=r.items.length,done=r.items.filter(t=>t.status==='done').length;
    const first='<span class="tree-cell" style="--depth:'+r.depth+'">'+(t?'<span class="issue-glyph">◇</span>':'<button class="fold" data-fold="'+attr(r.id)+'" aria-expanded="'+!closedGroups.has(r.id)+'" aria-label="'+attr(r.v)+' 접기 또는 펼치기">'+(closedGroups.has(r.id)?'▸':'▾')+'</button>')+
      (t?'<span class="issue-key">MI-'+String(t.id).padStart(3,'0')+'</span>':'<em class="group-key">'+levelIcon(r.k)+' '+esc(fieldNames[r.k]||'그룹')+'</em>')+'<b>'+esc(t?t.title:r.v)+'</b>'+(t?'':'<small>'+n+'</small>')+'</span>';
    return '<tr tabindex="0" draggable="true" data-row="'+attr(r.id)+'" aria-selected="'+(selection===r.id)+'" class="'+(t?'issue-row':'group-row')+'"><td>'+first+'</td><td>'+(t?'<span class="ast-status '+statusColors[t.status]+'">'+statusLabels[t.status]+'</span>':'<span class="roll"><i style="width:'+(n?100*done/n:0)+'%"></i></span> '+done+'/'+n)+'</td><td>'+esc(t?.product||'')+'</td><td>'+esc(t?.requester||'')+'</td><td>'+(t?esc(t.due?.slice(5)||'—'):'')+'</td></tr>';
  }
  main.innerHTML='<div class="page astra"><div class="astra-heading"><div><div class="head-date"><span class="line"></span>워크스페이스 / 구조</div><h1>업무 구조</h1></div><button class="btn primary" id="new-issue">'+icon('plus')+' 이슈 추가</button></div><div class="s-tabs">'+[['groups','이슈 트리'],['schema','분류 편집'],['rules','노트 위치 규칙'],['files','페이지 위치']].map(([k,v])=>button(v,'data-switch="'+k+'"',k==='groups')).join('')+'</div><section class="ast-sheet"><div class="hierarchy"><strong>계층</strong>'+(freeMode?'<b>자유 배치</b>':levels.map((k,i)=>'<button draggable="true" class="level" data-level="'+k+'" title="드래그 또는 Alt+방향키로 순서 변경"><span>⠿</span> '+levelIcon(k)+' '+esc(fieldNames[k])+'</button><i>›</i>').join('')+'<b>이슈</b>')+'<button class="chip" id="level-setup">'+'계층 편집'+'</button></div>'+
    '<div class="ast-tools"><button id="expand-all">⊞ 모두 펼치기</button><button id="collapse-all">⊟ 모두 접기</button><span class="vr"></span><button id="duplicate" '+(!selected?'disabled':'')+'>⧉ '+(selected?.k==='epic'?'에픽 복사':selected&&!selected.t?'그룹 복사':'복사')+'</button><button id="inspect" '+(!selected?.t?'disabled':'')+'>이슈 열기</button><small>'+tasks.length+'개 이슈 · '+groups.length+'개 그룹</small></div><div class="ast-scroll"><table class="ast-table"><thead><tr><th>계층 / 이슈명</th><th>상태 · 완료율</th><th>제품</th><th>요청자</th><th>납기</th></tr></thead><tbody>'+displayed.map(tableRow).join('')+'</tbody></table></div><div class="ast-foot">'+(freeMode?'그룹 가운데에 놓으면 하위로, 행 위쪽에 놓으면 그 앞으로 이동합니다.':'행 선택 후 복사 · 이슈 더블클릭으로 상세 열기 · 이슈를 그룹에 놓아 재분류')+'</div></section>'+footer()+'</div>';
  const click=(id,fn)=>{const el=byId(id);if(el)el.onclick=fn};
  main.querySelectorAll('[data-switch]').forEach(b=>b.onclick=()=>{structureTab=b.dataset.switch;render()});
  click('expand-all',()=>{closedGroups.clear();render()});click('collapse-all',()=>{closedGroups=new Set(groups.map(r=>r.id));render()});
  click('duplicate',()=>duplicateRow(selected));click('inspect',()=>inspector(selected.t.id));click('new-issue',()=>createIssue(selected?.props||{},freeMode&&selected?(selected.t?selected.parent:selected.id):''));
  click('level-setup',levelEditor);
  main.querySelectorAll('[data-fold]').forEach(b=>b.onclick=e=>{e.stopPropagation();const id=b.dataset.fold;closedGroups.has(id)?closedGroups.delete(id):closedGroups.add(id);render()});
  function drag(el,value,accept,drop){
    el.ondragstart=e=>{viewDrag=value;dragged=value.row?.t?{task:value.row.t.id}:null;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','astra')};
    el.ondragover=e=>{if(accept(viewDrag)){e.preventDefault();el.classList.add('drop-over')}};
    el.ondragleave=()=>el.classList.remove('drop-over');el.ondragend=()=>{viewDrag=null;dragged=null;el.classList.remove('drop-over')};
    el.ondrop=e=>{if(!accept(viewDrag))return;e.preventDefault();const v=viewDrag;viewDrag=null;dragged=null;el.classList.remove('drop-over');drop(v,e)};
  }
  main.querySelectorAll('[data-level]').forEach(el=>{const k=el.dataset.level;
    drag(el,{level:k},v=>v?.level,v=>reorderLevels(v.level,k));
    el.onkeydown=e=>{if(e.altKey&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();reorderLevels(k,levels[levels.indexOf(k)+(e.key==='ArrowLeft'?-1:1)]);main.querySelector('[data-level="'+k+'"]')?.focus()}};
  });
  main.querySelectorAll('[data-row]').forEach(el=>{
    const r=rowMap.get(el.dataset.row);
    // Keep the row DOM alive on selection so native double-click and drag stay intact.
    const select=()=>{selection=r.id;main.querySelector('[aria-selected=true]')?.setAttribute('aria-selected','false');el.setAttribute('aria-selected','true');byId('duplicate').disabled=false;byId('duplicate').textContent=r.t?'⧉ 이슈 복사':r.k==='epic'?'⧉ 에픽 복사':'⧉ 그룹 복사';byId('duplicate').onclick=()=>duplicateRow(r);byId('inspect').disabled=!r.t;byId('inspect').onclick=()=>r.t&&inspector(r.t.id);byId('new-issue').onclick=()=>createIssue(r.props,freeMode?(r.t?r.parent:r.id):'')};
    el.onclick=select;el.ondblclick=()=>r.t?inspector(r.t.id):el.querySelector('[data-fold]').click();
    el.onkeydown=e=>{if(e.target!==el)return;if(e.key==='Enter'){e.preventDefault();select();el.ondblclick()}else if(e.key===' '){e.preventDefault();select()}};
    drag(el,{row:r},v=>v?.row&&v.row!==r&&(freeMode||v.row.t&&!r.t),(v,e)=>placeRow(v.row,r,e.clientY-el.getBoundingClientRect().top<7));
  });
}


const levelPalette=[
  ['layers','#b8a2ff','보라 · 층'],['grid','#5de1dc','민트 · 격자'],['box','#8cb5ff','파랑 · 상자'],
  ['person','#ffbf84','살구 · 사람'],['flag','#f5a9ce','분홍 · 깃발'],['ring','#e5d580','노랑 · 원']
];
const glyphs={layers:'<path d="m3 8 9-5 9 5-9 5zM3 12l9 5 9-5M3 16l9 5 9-5"/>',grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',box:'<path d="m3 7 9-4 9 4v10l-9 4-9-4zm0 0 9 5 9-5m-9 5v9"/>',person:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',flag:'<path d="M5 21V3l14 3-4 5 4 4-14-2"/>',ring:'<circle cx="12" cy="12" r="8"/>'};
const stylesByKey={epic:0,kind:1,product:2,requester:3};
function levelIcon(k,map=stylesByKey){
  const [glyph,color]=levelPalette[map[k]??4];
  return '<svg aria-hidden="true" style="width:14px;height:14px;vertical-align:-2px;color:'+color+'" viewBox="0 0 24 24">'+glyphs[glyph]+'</svg>';
}
function levelEditor(){
  const draft=levels.slice(),names={...fieldNames},visual={...stylesByKey},added=[];
  let mode=freeMode,active=draft[0]||'epic';
  function paint(){
    const keys=[...groupKeys(),...added];
    const list=draft.map((k,i)=>'<div class="lv-row" draggable="true" data-lv-row="'+k+'"><button class="chip" data-edit-key="'+k+'" aria-pressed="'+(k===active)+'">'+levelIcon(k,visual)+' '+esc(names[k])+'</button><span class="spacer"></span><button class="icon-btn" data-up="'+i+'" aria-label="위로" '+(!i?'disabled':'')+'>↑</button><button class="icon-btn" data-down="'+i+'" aria-label="아래로" '+(i===draft.length-1?'disabled':'')+'>↓</button><button class="icon-btn" data-hide="'+i+'" aria-label="보기에서 제외">×</button></div>').join('');
    drawer('계층 편집','<h2>업무 계층</h2><p class="tiny">위에서 아래로 묶을 순서입니다. 이슈는 마지막 단계에 표시됩니다.</p><div class="lv-box">'+list+'<div class="lv-row">◇ 이슈</div></div><div class="flex">'+button('분류 기준','data-mode="fields"',!mode)+button('자유 배치','data-mode="free"',mode)+'</div><span class="label">추가할 분류</span>'+keys.filter(k=>!draft.includes(k)).map(k=>button(names[k],'data-include="'+k+'"')).join('')+'<div class="s-form"><input class="field" id="new-level-name" placeholder="새 분류 이름" aria-label="새 분류 이름" maxlength="50"><button class="btn" id="make-level">분류 만들기</button></div>'+(draft.includes(active)?'<span class="label">'+esc(names[active])+' 아이콘과 색</span>'+levelPalette.map(([g,c,l],i)=>button(l,'data-style="'+i+'"',i===(visual[active]??4))).join(''):''),'<button class="btn" data-close>취소</button><button class="btn primary" id="apply-levels">적용</button>');
    const all=(attr,fn)=>overlayRoot.querySelectorAll('['+attr+']').forEach(b=>b.onclick=()=>fn(b.getAttribute(attr)));
    const move=(i,j)=>{if(j>=0&&j<draft.length){draft.splice(j,0,draft.splice(i,1)[0]);mode=false;paint()}};
    all('data-up',i=>move(+i,+i-1));all('data-down',i=>move(+i,+i+1));
    all('data-hide',i=>{draft.splice(+i,1);active=draft[0];mode=false;paint()});
    all('data-mode',v=>{mode=v==='free';paint()});all('data-edit-key',k=>{active=k;paint()});
    all('data-style',i=>{visual[active]=+i;paint()});
    all('data-include',k=>{draft.push(k);active=k;mode=false;paint()});
    let from;overlayRoot.querySelectorAll('[data-lv-row]').forEach(el=>{
      el.ondragstart=e=>{from=draft.indexOf(el.dataset.lvRow);e.dataTransfer.setData('text/plain','level')};
      el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();if(Number.isInteger(from))move(from,draft.indexOf(el.dataset.lvRow))};
    });
    byId('make-level').onclick=()=>{const name=byId('new-level-name').value.trim();
      if(!validName(name)||[...Object.values(names),'이슈','월','연도'].includes(name)){toast('다른 분류 이름을 입력하세요.');return}
      const k='field'+(++serial);added.push(k);draft.push(k);names[k]=name;visual[k]=(added.length+3)%levelPalette.length;active=k;mode=false;paint()};
    byId('apply-levels').onclick=()=>{
      for(const k of added){customKeys.add(k);fieldNames[k]=names[k];choices[k]=[];lastFields[k]=''}
      Object.assign(stylesByKey,visual);levels=draft.slice();selection='';closedGroups.clear();closeOverlay();
      if(mode&&!freeTree){startFree();return}freeMode=mode;render();
    };
  }
  paint();
}
function createIssue(presets={},parent=''){
  const draft={...defaultFields(),...presets};
  drawer('이슈 추가','<label class="label" for="issue-name">이슈 제목</label><input id="issue-name" class="field" maxlength="200"><div id="issue-fields"></div>','<button class="btn" data-close>취소</button><button id="add-issue-only" class="btn primary">이슈 추가</button>');
  fieldControls(byId('issue-fields'),draft);byId('issue-name').focus();
  byId('add-issue-only').onclick=()=>{const title=byId('issue-name').value.trim();if(!title){byId('issue-name').focus();return}
    const t=makeTask(title,draft);tasks.push(t);rememberFields(t);selection=issueKey(t);closedGroups.clear();
    if(freeMode)freeTree.set(selection,{id:selection,parent,taskId:t.id});closeOverlay();render();toast('이슈를 추가했습니다.')};
}
