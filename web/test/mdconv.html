<!doctype html>
<meta charset="utf-8"><title>mdconv tests</title>
<link rel="stylesheet" href="/css/note.css">
<!-- Open http://127.0.0.1:8765/test/mdconv.html — every line should start with PASS. -->
<pre id="out">running…</pre>
<script type="module">
import { mdToHtml, htmlToMd, loadInto, refreshExcelTableViews } from "/js/mdconv.js";
import { readExcelTable, serializeExcelTable } from "/js/excel-table-block.js";
import { openFor } from "/js/contextmenu.js";
import { runNoteLineAction } from "/js/note-lines.js";
import { bindNoteTables } from "/js/note-table.js";
import { mountFormatBar } from "/js/note-format.js";
import { editorKeys } from "/js/lineeditor.js";
const load = (md) => { const d = document.createElement("div"); loadInto(d, md); return d; };
// untouched: the file is opened and saved without edits
const rt = (md) => htmlToMd(load(md));
// Recompute editable block content while retaining the source positions and read-only originals.
const rw = (md) => {
  const d = load(md);
  for (const n of d.children) if (!n.hasAttribute("data-raw")) n.removeAttribute("data-sig");
  return htmlToMd(d);
};
const res = [];
const ok = (cond, name, info = "") => res.push(`${cond ? "PASS" : "FAIL"} ${name}${cond ? "" : "\n  " + info}`);
const show = (v) => JSON.stringify(v);

{
  const label = 'LOT-TEST-001 <img src="example">';
  const source = {
    version: 1, id: "range-1", columns: ["lot", "value"], columnWidths: { lot: "80pt" },
    rows: [
      { id: "first", height: "32", cells: [
        { displayText: label, value: null, rowSpan: 2, styles: { color: "#112233", "font-family": '"A and B"' },
          richText: [[{ text: label, styles: { "font-weight": "bold" } }]] },
        { displayText: "12.5%", value: { type: "number", raw: "0.125" } },
      ] },
      { id: "second", cells: [null, null] },
    ],
  };
  const fence = serializeExcelTable(source, "\r\n");
  const file = "앞 문단\n\r\n" + fence + "\n\n뒤 문단";
  const editor = load(file);
  const grid = editor.querySelector(".note-excel-grid");
  const cell = grid?.rows[0].cells[0];
  ok(grid && !grid.hidden && cell.rowSpan === 2 && grid.rows[1].cells.length === 1, "Excel view: merge and independent blank cell");
  ok(cell?.textContent === label && !editor.querySelector("img") && cell.querySelector("span")?.style.fontWeight === "bold"
     && cell.style.fontFamily.includes("A and B"),
     "Excel view: formatted cell text is escaped");
  ok(grid?.querySelector("col").style.width === "80pt" && grid.rows[0].style.height === "32px"
     && grid.rows[0].cells[1].style.textAlign === "right", "Excel view: dimensions and General numeric alignment");
  ok(!grid.hasAttribute("data-excel-fixed") && !grid.style.width,
     "Excel view: incomplete column widths use intrinsic sizing");
  const knownWidths = serializeExcelTable({ ...source, columnWidths: { lot: "45pt", value: "60" } });
  const fixedEditor = load(knownWidths);
  const fixedGrid = fixedEditor.querySelector(".note-excel-grid");
  ok(fixedGrid.hasAttribute("data-excel-fixed") && fixedGrid.getAttribute("style").includes("width:calc(45pt + 60px)")
     && fixedGrid.rows[0].cells[0].rowSpan === 2 && htmlToMd(fixedEditor) === knownWidths,
     "Excel view: complete mixed-unit column widths size the merged grid without rewriting it",
     fixedGrid.style.width);
  ok(htmlToMd(editor) === file && rt(rt(file)) === file, "Excel view: mixed EOL round trip");
  editor.firstElementChild.textContent = "수정한 문단";
  ok(htmlToMd(editor).includes(fence) && rt(htmlToMd(editor)) === htmlToMd(editor), "Excel view: editing an adjacent paragraph preserves the fence");

  const unsupported = fence.replace('"version": 1', '"version": 2');
  const broken = "```mi-excel-table\n{broken\n```";
  const sameColumn = fence + "\n\n" + unsupported + "\n\n" + broken;
  ok(!load(sameColumn).querySelector(".note-excel-grid:not([hidden])") && rt(rt(sameColumn)) === sameColumn,
     "Excel view: unsupported duplicates and malformed blocks stay raw");

  const documentRoot = document.createElement("div");
  const left = load(fence), right = load(unsupported);
  documentRoot.append(left, right);
  refreshExcelTableViews(documentRoot);
  ok(left.querySelector(".note-excel-grid").hidden && !left.querySelector("pre").hidden &&
     htmlToMd(left) === fence && htmlToMd(right) === unsupported, "Excel view: duplicate IDs across columns remain raw");
  right.remove();
  refreshExcelTableViews(documentRoot);
  ok(!left.querySelector(".note-excel-grid").hidden && left.querySelector("pre").hidden, "Excel view: remaining table renders after duplicate removal");
}

// ---- canonical files: original == 1st save == 2nd save, both untouched and fully rewritten
const canon = {
  "heading+para": "# 제목\n\n본문 한 줄\n",
  "inline": "**굵게** *기울임* ~~취소~~ `code`\n",
  "allowed html": '<u>밑줄</u> <mark style="background:#a5d8ff">파랑</mark> <span style="color:#d93025;font-size:22px">색크기</span>\n',
  "lists": "- a\n- b\n\n1. x\n2. y\n\n- [ ] 할일\n- [x] 완료\n",
  "image": "![](files/img-20261124-101010.png)\n",
  "image widths": "![](files/a.png){size=small}\n\n![](files/b.png){width=480}\n\n![](files/c.png){size=orig}\n\n![](files/d.png)\n",
  "escapes": "별표 \\*가 \\* 그대로 \\<script> 와 EQ_A01\n",
  "line start": "\\# 해시로 시작\n\n\\- 대시로 시작\n\n1\\. 숫자로 시작\n\n\\> 꺾쇠로 시작\n\n\\| 파이프로 시작\n\n\\---\n\n\\#### 넷\n",
  "multi-line para": "첫줄\n둘째줄\n",
  "bold italic": "***둘다***\n",
  // P3-02R: journal line model
  "nested list": "- 상위\n  - 하위\n    - 더 하위\n  - 하위2\n- 상위2\n",
  "all marks": "- [ ] 할일\n- [x] 완료\n- [*] 별표\n- [!] 긴급\n  - [ ] 하위 할일\n  - [*] 하위 별표\n",
  "marks without bullets text": "- 그냥\n  - [!] 긴급\n- 다시 그냥\n",
  "journal highlight": "- <mark>형광</mark> 줄\n  - [*] 앞 <mark>하위 형광</mark> 뒤\n\n문단 <mark>형광</mark>\n",
  "styled yellow keeps its spelling": '- <mark style="background:#fff176">노랑</mark>\n',
  "nested ordered": "1. 하나\n  - 하위\n2. 둘\n",
  "mark-looking text is escaped": "- \\[x] 글자일 뿐\n",
  "empty items": "- \n- [ ]\n  - [x]\n".replace(/ \n/g, "\n"),
  "korean marks": "- [*] 한글 별표 항목\n  - [!] 한글 긴급 <mark>형광</mark>\n",
};
for (const [name, md] of Object.entries(canon)) {
  for (const [how, f] of [["untouched", rt], ["rewritten", rw]]) {
    const once = f(md), twice = f(once);
    ok(once === md && twice === md, `${how}: ${name}`, `in : ${show(md)}\n  1st: ${show(once)}\n  2nd: ${show(twice)}`);
  }
}

// ---- files the app did not write: untouched stays byte-identical (and rewriting settles after one save)
const foreign = {
  "code fence": "문장\n\n```python\n# not a heading\n\n- not a list\n**x**\n```\n\n끝\n",
  "tilde fence": "~~~\nraw <b>\n~~~\n",
  "unclosed fence": "```\nraw 1\n\nraw 2\n",
  "table": "| A | B |\n| --- | --- |\n| 1 | 2 |\n\n끝\n",
  "table without outer pipes": "A | B\n--- | ---\n1 | 2\n",
  "table without outer pipes row": "|a|b|\n|:-|-:|\n|1|2|\n",
  "quote": "> 인용 1\n> 인용 2\n\n본문\n",
  "html comment": "<!-- column -->\n\n<!--\n여러 줄\n-->\n\n본문\n",
  "deep heading and rule": "#### 넷째\n\n---\n\n본문\n",
  "star/plus bullets": "* a\n+ b\n  * c\n",
  "uppercase X mark": "- [X] 완료\n",
  "four-space nesting": "- a\n    - b\n        - c\n",
  "tab nesting": "- a\n\t- b\n",
  "extra blank lines": "# A\n\n\n\n본문\n\n\n",
  "no blank between blocks": "# A\n본문\n- a\n- b\n다음\n",
  "no trailing newline": "# 제목\n\n본문",
  "leading blank lines": "\n\n# 제목\n\n본문\n",
  "crlf": "# 제목\r\n\r\n- a\r\n  - b\r\n\r\n```\r\nraw\r\n```\r\n",
  "mixed line endings": "# 제목\r\n\r\n```\n- A\r```\n\n본문\r\n",
  "wikilink title with literal formatting symbols": "앞 [[대상 *설비* <u> #!]] 뒤\n",
  "escaped wikilink opener": "앞 \\[[대상]] 뒤\n",
  "trailing spaces": "문장  \n둘째 줄  \n\n- a  \n",
  "mixed everything": "# 보고\n\n> 요약\n\n- [x] 완료\n  - [*] 하위\n\n```sh\necho hi\n```\n\n| a | b |\n|---|---|\n| 1 | 2 |\n\n[[링크]] → 할일 #12\n",
};
for (const [name, md] of Object.entries(foreign)) {
  const once = rt(md), twice = rt(once);
  ok(once === md && twice === md, `untouched: ${name}`, `in : ${show(md)}\n  out: ${show(once)}`);
  const w1 = rw(md), w2 = rw(w1);
  ok(w1 === w2, `rewritten settles: ${name}`, `1st: ${show(w1)}\n  2nd: ${show(w2)}`);
}
// rewriting must never lose a code fence / table / quote / comment line (these only ever pass through)
for (const name of ["code fence", "table", "quote", "html comment"]) {
  const md = foreign[name];
  const d = load(md);
  d.querySelector("p, div:not(.raw)")?.append?.("");
  ok(htmlToMd(d) === md, `raw blocks survive an unrelated edit: ${name}`, show(htmlToMd(d)));
}

// ---- validated worksheet fills layer on top of the stored background color.
{
  const patterns = [
    "gray-0625", "gray-125", "gray-25", "gray-50", "gray-75",
    "horz-stripe", "vert-stripe", "diag-stripe", "reverse-diag-stripe", "diag-cross", "thick-diag-cross",
    "thin-horz-stripe", "thin-vert-stripe", "thin-diag-stripe", "thin-reverse-diag-stripe",
    "thin-horz-cross", "thin-diag-cross",
  ];
  const source = {
    version: 1, id: "fills", columns: ["a", "b"],
    rows: patterns.map((pattern, i) => ({
      id: "r" + i,
      cells: [
        { displayText: pattern, value: null, fillPattern: { pattern, foreground: "#b52" }, styles: { "background-color": "#fed" } },
        { displayText: "Solid", value: null, styles: { "background-color": "#fed" } },
      ],
    })),
  };
  const fenced = serializeExcelTable(source);
  const editor = load(fenced);
  const rows = [...editor.querySelector(".note-excel-grid").rows];
  const gradients = rows.map(({ cells }) => [cells[0].style.backgroundImage, cells[0].style.backgroundSize].join(" "));
  ok(rows.every(({ cells }) => cells[0].style.backgroundImage.includes("gradient(")
    && cells[0].style.backgroundColor === cells[1].style.backgroundColor && !cells[1].style.backgroundImage),
  "Excel view: every validated fill paints over the base color while adjacent solid cells stay solid");
  ok(new Set(gradients).size === patterns.length && htmlToMd(editor) === fenced,
    "Excel view: saved patterns appear distinct without rewriting the raw block");
}

// ---- editing one thing changes only that thing
{
  const md = "# 제목\n\n```\n# 코드\n\n- 목록 아님\n```\n\n- 상위\n  - 하위\n- [*] 별표\n\n> 인용\n\n\n마지막\n";
  const d = load(md);
  d.querySelector("h1").append(" 단어");
  const want = md.replace("# 제목", "# 제목 단어");
  ok(htmlToMd(d) === want, "one word in a heading rewrites nothing else", show(htmlToMd(d)));
  const d2 = load(md);
  d2.querySelector("li[data-m='*']").setAttribute("data-m", "!");
  ok(htmlToMd(d2) === md.replace("- [*] 별표", "- [!] 별표"), "changing one mark rewrites only that line", show(htmlToMd(d2)));
  const d3 = load(md);
  d3.querySelector(".raw[data-k='quote']").remove();
  ok(htmlToMd(d3) === md.replace("> 인용\n\n\n", ""), "deleting a raw block removes just it", show(htmlToMd(d3)));
  const d4 = load(md);
  const last = d4.lastElementChild;
  last.after(Object.assign(document.createElement("div"), { textContent: "새 문단" }));
  ok(htmlToMd(d4) === md + "\n새 문단\n", "appended paragraph follows with one blank line", show(htmlToMd(d4)));
  const d5 = load(md);
  d5.querySelector("ul li").append(document.createTextNode(" 추가"));
  ok(htmlToMd(d5) === md.replace("- 상위\n  - 하위", "- 상위 추가\n  - 하위"), "editing a list item keeps nesting", show(htmlToMd(d5)));
  const d6 = load("a\n\nb\n");
  d6.firstElementChild.textContent = "";
  ok(htmlToMd(d6) === "b\n", "emptied paragraph disappears", show(htmlToMd(d6)));
}

// ---- reader: structure
{
  const d = load("- 상위\n  - [x] 하위\n    - [*] 별\n- 둘째\n");
  const ul = d.querySelector("ul");
  ok(ul.children.length === 2 && ul.querySelector("ul ul li[data-m='*']") && ul.querySelector("ul > li[data-m='x']"), "reader nests lists and keeps marks", d.innerHTML);
  const r = load("```js\nlet a = 1 < 2;\n```\n");
  ok(r.querySelector(".raw pre code")?.textContent === "let a = 1 < 2;" && r.querySelector(".raw").contentEditable === "false", "code fence is read-only text", r.innerHTML);
  const tb = load("| A | B |\n| - | - |\n| 1 | 2 |\n");
  ok(tb.querySelectorAll(".raw table th").length === 2 && tb.querySelectorAll(".raw table td").length === 2, "table is shown as a table", tb.innerHTML);
}

// ---- security and cleanup
const d = document.createElement("div");
d.innerHTML = '<div><span style="color:#123456;font-size:20px">x</span><font face="a">y</font><a href="http://e.com">z</a><a href="javascript:void(0)">w</a></div>';
const dropped = htmlToMd(d);
ok(dropped === "xy[z](http://e.com)w\n", "disallowed styling and unsafe URLs are dropped, safe links are retained", show(dropped));
const h = mdToHtml('<scr' + 'ipt>alert(1)</scr' + 'ipt> <img src=x onerror=1> <span style="color:red;x:y">q</span>');
const probe = document.createElement("div");
probe.innerHTML = h;
const bad = probe.querySelector("script,img") || [...probe.querySelectorAll("*")].find((e) => [...e.attributes].some((a) => /^on/i.test(a.name)));
ok(!bad, "reader neutralises raw html");
const hostile = load('```\n<script>alert(1)<\/script><img src=x onerror=1>\n```\n\n| <img src=x onerror=1> |\n|---|\n\n> <b onclick=1>q</b>\n');
ok(!hostile.querySelector("script,img,b") && ![...hostile.querySelectorAll("*")].some((e) => [...e.attributes].some((a) => /^on/i.test(a.name))), "raw blocks cannot inject html", hostile.innerHTML);

{
  const editor = load("상위\n하위\n마지막\n");
  editor.contentEditable = "true";
  document.body.append(editor);
  editor.focus();
  getSelection().collapse(editor.children[1].firstChild, 0);
  runNoteLineAction(editor, "indent");
  ok(htmlToMd(editor) === "상위\n  하위\n마지막\n", "Tab indents the selected plain line", show(htmlToMd(editor)));
  runNoteLineAction(editor, "outdent");
  ok(htmlToMd(editor) === "상위\n하위\n마지막\n", "Shift+Tab restores plain line depth");
  runNoteLineAction(editor, "indent");
  getSelection().collapse(editor.children[0].firstChild, 0);
  runNoteLineAction(editor, "down");
  ok([...editor.children].map(n => n.textContent + (n.dataset.indent || "")).join(",") === "마지막,상위,하위1",
     "Alt+Down moves a plain parent with its child");
  editor.remove();
}
{
  const md = "# 왼쪽\r\n\r\n<!-- column -->\n\n```md\n<!-- column -->\n```\n\n오른쪽\n";
  const editor = load(md);
  editor.querySelector("h1").append(" 수정");
  ok(htmlToMd(editor) === md.replace("왼쪽", "왼쪽 수정"), "column boundary and fenced example survive edits");
}
{
  const original = "제목\r\n\r\nA | B\r\n:--- | ---:\r\nX\\|Y | 10\r\nQ | 2\r\n\r\n본문\n";
  const editor = load(original);
  let changes = 0;
  bindNoteTables(editor, () => changes++).refresh();
  const input = editor.querySelector('textarea[data-row="1"][data-column="0"]');
  ok(input?.value === "X|Y" && htmlToMd(editor) === original, "table mount preserves original mixed EOL and pipes");
  if (input) {
    input.value = "수정 | 값";
    input.dispatchEvent(new InputEvent("input", { bubbles: true }));
    ok(changes === 1 && htmlToMd(editor) === original.replace("X\\|Y | 10", "| 수정 \\| 값 | 10 |"),
       "table edit changes only the selected row");
  }
}
// ---- P3-04: the toolbar writes only preset formats and the saved file round-trips unchanged
{
  const wait = async () => fmt.syncNow(); // rAF does not run in a hidden pane
  const host = document.createElement("div");
  host.style.cssText = "position:fixed;left:-9999px;top:0;width:600px";
  const bar = document.createElement("div");
  const ed = document.createElement("div");
  ed.contentEditable = "true";
  host.append(bar, ed);
  document.body.append(host);
  document.execCommand("styleWithCSS", false, true);
  const fmt = mountFormatBar(ed, bar, { compact: false, schedule() {}, lineAction() {}, insertTable() {}, fold() {}, cleanups: [] });
  const btn = (label) => [...bar.querySelectorAll("button.nb")].find((b) => b.getAttribute("aria-label") === label);
  const pick = (text) => {
    ed.focus();
    const w = document.createTreeWalker(ed, NodeFilter.SHOW_TEXT);
    for (let t = w.nextNode(); t; t = w.nextNode()) {
      const i = t.data.indexOf(text);
      if (i < 0) continue;
      const r = document.createRange();
      r.setStart(t, i);
      r.setEnd(t, i + text.length);
      getSelection().removeAllRanges();
      getSelection().addRange(r);
      return;
    }
  };
  const reload = (md) => { loadInto(ed, md); };
  const labels = [...bar.querySelectorAll("button.nb")].map((b) => b.getAttribute("aria-label"));
  ok(bar.getAttribute("role") === "toolbar" && labels.every(Boolean), "toolbar: role and a label on every button", show(labels));
  ok(!bar.querySelector("select, option"), "toolbar: chips only, no dropdowns (D-12)");
  const apply = (md, word, ...labs) => { reload(md); pick(word); labs.forEach((l) => btn(l).click()); return htmlToMd(ed); };
  ok(apply("가 단어 나\n", "단어", "굵게") === "가 **단어** 나\n", "toolbar: bold");
  ok(apply("가 단어 나\n", "단어", "기울임") === "가 *단어* 나\n", "toolbar: italic");
  ok(apply("가 단어 나\n", "단어", "밑줄") === "가 <u>단어</u> 나\n", "toolbar: underline");
  ok(apply("가 단어 나\n", "단어", "취소선") === "가 ~~단어~~ 나\n", "toolbar: strike");
  ok(apply("가 단어 나\n", "단어", "글자 크기 22px (대)") === '가 <span style="font-size:22px">단어</span> 나\n', "toolbar: preset size");
  ok(apply("가 단어 나\n", "단어", "글자색 빨강") === '가 <span style="color:#d93025">단어</span> 나\n', "toolbar: preset color");
  ok(apply("가 단어 나\n", "단어", "형광펜 하늘") === '가 <mark style="background:#a5d8ff">단어</mark> 나\n', "toolbar: preset highlight");
  ok(apply("가 단어 나\n", "단어", "형광펜 노랑") === "가 <mark>단어</mark> 나\n", "toolbar: default highlight keeps the bare mark");
  ok(apply("가 단어 나\n", "단어", "글자색 빨강", "글자색 기본색") === "가 단어 나\n", "toolbar: default color removes the color");
  ok(apply("가 단어 나\n", "단어", "글자색 빨강", "글자색 빨강") === "가 단어 나\n", "toolbar: second click on the same color resets it");
  ok(apply("가 단어 나\n", "단어", "글자 크기 22px (대)", "글자 크기 15px (보통)") === "가 단어 나\n", "toolbar: base size removes the size");
  ok(apply("가 단어 나\n", "단어", "형광펜 하늘", "형광펜 하늘") === "가 단어 나\n", "toolbar: second click on the same highlight removes it");
  ok(apply("가 단어 나\n", "단어", "굵게", "기울임", "글자색 초록", "글자 크기 18px (중)", "형광펜 분홍", "서식 지우기") === "가 단어 나\n", "toolbar: clear format removes everything");
  const mixed = apply("가 단어 나\n", "단어", "굵게", "글자색 파랑", "글자 크기 28px (특대)", "형광펜 살구");
  ok(mixed === htmlToMd(load(mixed)) && mixed === rt(rt(mixed)), "toolbar: combined formats save the same after reopen", show(mixed));
  ok(/<span style="color:#1a73e8;font-size:28px">/.test(mixed) && mixed.includes("**") && mixed.includes("#ffd8a8"), "toolbar: combined formats keep every preset", show(mixed));
  ok(!/rgb\(|xxx|<font|font-weight|text-decoration/i.test(mixed), "toolbar: no browser-specific markup in the file", show(mixed));
  // state follows the caret
  reload("가 **굵게** 보통 <span style=\"font-size:22px\">큰글자</span> <span style=\"color:#d93025\">빨강</span>\n");
