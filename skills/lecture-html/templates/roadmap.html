<!-- mi-lecture-runtime:start v1 roadmap — 화면 코드, 고치지 않는다 -->
<script>
/* MI study roadmap v1 — offline. Data: #roadmap-data. State via MI_Planner page state (postMessage). */
(() => {
  "use strict";
  const DATA = JSON.parse(document.getElementById("roadmap-data").textContent);
  const TRACKS = DATA.tracks, MODS = DATA.modules;
  const byId = new Map(MODS.map((m) => [m.id, m]));
  const trackOf = new Map(TRACKS.map((t) => [t.id, t]));
  const kids = new Map(MODS.map((m) => [m.id, []]));
  MODS.forEach((m) => (m.prereq || []).forEach((p) => kids.has(p) && kids.get(p).push(m.id)));
  const depthMemo = new Map();
  const depth = (id, seen = new Set()) => {
    if (depthMemo.has(id)) return depthMemo.get(id);
    if (seen.has(id)) return 0;
    seen.add(id);
    const m = byId.get(id), d = (m.prereq || []).filter((p) => byId.has(p)).reduce((a, p) => Math.max(a, depth(p, seen) + 1), 0);
    depthMemo.set(id, d);
    return d;
  };
  MODS.forEach((m) => depth(m.id));
  const h = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const cvar = (c) => `var(--${c || "blue"})`;
  const ST = { todo: "예정", doing: "진행 중", done: "완료" };

  /* ----- state ----- */
  const S = { status: {}, memo: {}, theme: "auto", view: "path", track: "all", sfilter: "all" };
  let mode = "memory", seq = 0, timer = 0;
  const pending = new Map(), inApp = window.parent && window.parent !== window, LS = "mi-roadmap:" + document.title;
  const ask = (kind, state) => new Promise((res, rej) => {
    const id = "rm" + ++seq; pending.set(id, { res, rej });
    try { parent.postMessage({ miPlanner: kind, id, state }, "*"); } catch (e) { pending.delete(id); rej(e); return; }
    setTimeout(() => pending.delete(id) && rej(new Error("응답 없음")), 1500);
  });
  addEventListener("message", (ev) => {
    const d = ev.data; if (!d || d.miPlanner !== "reply" || ev.source !== parent) return;
    const p = pending.get(d.id); if (!p) return; pending.delete(d.id); d.error ? p.rej(new Error(d.error)) : p.res(d.state || {});
  });
  async function load() {
    if (inApp) { try { Object.assign(S, await ask("state-get")); mode = "app"; return; } catch { /* plain file */ } }
    try { const raw = localStorage.getItem(LS); if (raw) Object.assign(S, JSON.parse(raw)); mode = "local"; } catch { mode = "memory"; }
  }
  const saveEl = document.getElementById("save");
  function setSave(s) {
    saveEl.dataset.s = s;
    saveEl.replaceChildren(h("span", "", { app: "저장됨", local: "이 브라우저에 저장", memory: "미리보기 · 저장 안 됨", busy: "저장 중…", fail: "저장 실패" }[s]));
    if (s === "fail") { const b = h("button", "", "다시 시도"); b.type = "button"; b.onclick = save; saveEl.append(b); }
  }
  function save() {
    clearTimeout(timer); setSave("busy");
    timer = setTimeout(async () => {
      try {
        if (mode === "app") await ask("state-set", S);
        else if (mode === "local") localStorage.setItem(LS, JSON.stringify(S));
        setSave(mode);
      } catch { setSave("fail"); }
    }, 350);
  }
  const st = (id) => S.status[id] || "todo";
  const ready = (m) => (m.prereq || []).every((p) => st(p) === "done");

  /* ----- chips (D-12) ----- */
  function chips(host, options, get, set, label) {
    const g = h("div", "chips"); g.setAttribute("role", "group"); g.setAttribute("aria-label", label);
    const btns = options.map(([v, text, color, count]) => {
      const b = h("button", "chip"); b.type = "button"; b.dataset.v = v;
      if (color) { b.style.setProperty("--c", cvar(color)); b.append(h("span", "dot")); }
      b.append(text); if (count != null) b.append(h("small", "", String(count)));
      b.onclick = () => { set(v); paint(); };
      return b;
    });
    const paint = () => btns.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === String(get()))));
    g.append(...btns); host.replaceChildren(g); paint();
    return paint;
  }
  function applyTheme() {
    if (S.theme === "light" || S.theme === "dark") document.documentElement.dataset.theme = S.theme;
    else delete document.documentElement.dataset.theme;
  }

  /* ----- pieces ----- */
  function statusBadge(id) { const s = st(id), e = h("span", "st"); e.dataset.st = s; e.append(h("i"), ST[s]); return e; }
  function card(m) {
    const t = trackOf.get(m.track) || {}, b = h("button", "rm-card"); b.type = "button";
    b.dataset.id = m.id; b.dataset.st = st(m.id); b.style.setProperty("--c", cvar(t.color));
    const top = h("div", "top"); top.append(h("span", "id", m.id), h("span", "", t.name || ""), h("span", "lv", m.level));
    const ft = h("div", "ft"); ft.append(statusBadge(m.id), h("span", "", `${m.hours}시간`));
    if (m.page) ft.append(h("span", "lec", "강의"));
    b.append(top, h("div", "ti", m.title), ft);
    if ((m.prereq || []).length) b.append(h("div", "pre", "← " + m.prereq.join(", ")));
    b.onclick = () => openDrawer(m.id, b);
    b.setAttribute("aria-label", `${m.id} ${m.title}, ${ST[st(m.id)]}, ${m.level}, ${m.hours}시간`);
    return b;
  }
  const q = document.getElementById("q");
  function visible(m) {
    if (S.track !== "all" && m.track !== S.track) return false;
    if (S.sfilter !== "all" && (S.sfilter === "todo" ? st(m.id) === "done" : st(m.id) !== S.sfilter)) return false;
    const s = q.value.trim().toLowerCase();
    if (!s) return true;
    return [m.id, m.title, ...(m.outcomes || []), ...(m.refs || [])].join(" ").toLowerCase().includes(s);
  }

  function renderStats() {
    const done = MODS.filter((m) => st(m.id) === "done"), doing = MODS.filter((m) => st(m.id) === "doing");
    const hours = MODS.reduce((a, m) => a + m.hours, 0), left = MODS.filter((m) => st(m.id) !== "done").reduce((a, m) => a + m.hours, 0);
    const box = document.getElementById("stats"); box.replaceChildren();
    const stat = (label, val, sub, frac) => {
      const e = h("div", "rm-stat"), b = h("b", "", val); if (sub) b.append(h("small", "", " " + sub));
      e.append(h("span", "", label), b);
      if (frac != null) { const mm = h("div", "rm-meter"), i = h("i"); i.style.width = (frac * 100).toFixed(1) + "%"; mm.append(i); e.append(mm); }
      box.append(e);
    };
    stat("완료", String(done.length), `/ ${MODS.length}`, done.length / MODS.length);
    stat("진행 중", String(doing.length));
    stat("남은 시간", String(left), `/ ${hours}h`);
  }
  function renderTracks() {
    const box = document.getElementById("tracks"); box.replaceChildren();
    TRACKS.forEach((t) => {
      const ms = MODS.filter((m) => m.track === t.id), d = ms.filter((m) => st(m.id) === "done").length;
      const b = h("button", "rm-track"); b.type = "button"; b.style.setProperty("--c", cvar(t.color));
      b.setAttribute("aria-pressed", String(S.track === t.id));
      const tt = h("div", "t"); tt.append(h("i"), t.name);
      const mm = h("div", "rm-meter"), i = h("i"); i.style.width = (ms.length ? (d / ms.length) * 100 : 0) + "%"; mm.append(i);
      b.append(tt, h("div", "g", t.goal || ""), mm, h("div", "n", `${d} / ${ms.length} 모듈 · ${ms.reduce((a, m) => a + m.hours, 0)}시간`));
      b.onclick = () => { S.track = S.track === t.id ? "all" : t.id; save(); render(); };
      box.append(b);
    });
  }
  function renderNext() {
    const box = document.getElementById("next"); box.replaceChildren();
    const list = MODS.filter((m) => st(m.id) !== "done" && ready(m))
      .sort((a, b) => (st(b.id) === "doing") - (st(a.id) === "doing") || depth(a.id) - depth(b.id) || a.id.localeCompare(b.id)).slice(0, 4);
    if (!list.length) { box.append(h("div", "rm-empty", MODS.every((m) => st(m.id) === "done") ? "모든 모듈을 마쳤어요." : "선수 모듈을 먼저 완료하세요.")); return; }
    list.forEach((m) => box.append(card(m)));
  }

  let selected = null;
  function renderPath(board) {
    const vis = MODS.filter(visible);
    if (!vis.length) { board.append(h("div", "rm-empty", "조건에 맞는 모듈이 없어요.")); return; }
    const levels = [...new Set(vis.map((m) => depth(m.id)))].sort((a, b) => a - b);
    const graph = h("div", "rm-graph"), cols = h("div", "rm-cols");
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg"); svg.setAttribute("class", "rm-edges");
    cols.append(svg);
    levels.forEach((lv, i) => {
      const col = h("div", "rm-col"); col.append(h("div", "rm-col-h", `${i + 1}단계`));
      vis.filter((m) => depth(m.id) === lv)
        .sort((a, b) => TRACKS.findIndex((t) => t.id === a.track) - TRACKS.findIndex((t) => t.id === b.track) || a.id.localeCompare(b.id))
        .forEach((m) => col.append(card(m)));
      cols.append(col);
    });
    graph.append(cols); board.append(graph);
    const draw = () => {
      svg.replaceChildren();
      const box = cols.getBoundingClientRect();
      svg.setAttribute("width", cols.scrollWidth); svg.setAttribute("height", cols.scrollHeight);
      const pos = new Map([...cols.querySelectorAll(".rm-card")].map((c) => [c.dataset.id, c.getBoundingClientRect()]));
      const rel = selected ? related(selected) : null;
      vis.forEach((m) => (m.prereq || []).forEach((p) => {
        const a = pos.get(p), b = pos.get(m.id); if (!a || !b) return;
        const x1 = a.right - box.left, y1 = a.top + a.height / 2 - box.top, x2 = b.left - box.left, y2 = b.top + b.height / 2 - box.top, dx = Math.max(24, (x2 - x1) / 2);
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`);
        if (rel) {
          const hot = rel.has(p) && rel.has(m.id);
          path.setAttribute("class", hot ? "hot" : "dim");
          if (hot) path.style.setProperty("--c", cvar((trackOf.get(m.track) || {}).color));
        }
        svg.append(path);
      }));
      cols.querySelectorAll(".rm-card").forEach((c) => { c.classList.toggle("sel", c.dataset.id === selected); c.classList.toggle("dim", !!rel && !rel.has(c.dataset.id)); });
    };
    requestAnimationFrame(draw);
    new ResizeObserver(draw).observe(cols);
    redrawEdges = draw;
  }
  let redrawEdges = () => {};
  function related(id) {
    const out = new Set([id]);
    const up = (x) => (byId.get(x).prereq || []).forEach((p) => { if (byId.has(p) && !out.has(p)) { out.add(p); up(p); } });
    const down = (x) => (kids.get(x) || []).forEach((k) => { if (!out.has(k)) { out.add(k); down(k); } });
    up(id); down(id);
    return out;
  }
  function renderList(board) {
    const wrap = h("div", "rm-list");
    TRACKS.forEach((t) => {
      const ms = MODS.filter((m) => m.track === t.id && visible(m)); if (!ms.length) return;
      const g = h("section", "rm-group"); g.style.setProperty("--c", cvar(t.color));
      const hh = h("h3"); hh.append(h("i"), t.name, h("small", "", `${ms.length} 모듈`));
      const rows = h("div", "rm-rows");
      ms.sort((a, b) => depth(a.id) - depth(b.id) || a.id.localeCompare(b.id)).forEach((m) => {
        const r = h("div", "rm-row"), ti = h("button", "ti", m.title); ti.type = "button"; ti.dataset.id = m.id; ti.onclick = () => openDrawer(m.id, ti);
        const sc = h("div");
        chips(sc, [["todo", "예정"], ["doing", "진행"], ["done", "완료"]], () => st(m.id), (v) => setStatus(m.id, v), `${m.id} 상태`);
        r.append(h("span", "id", m.id), ti, h("span", "meta", m.level), h("span", "meta", `${m.hours}h`), sc);
        rows.append(r);
      });
      g.append(hh, rows); wrap.append(g);
    });
    if (!wrap.children.length) wrap.append(h("div", "rm-empty", "조건에 맞는 모듈이 없어요."));
    board.append(wrap);
  }
  function render() {
    renderStats(); renderTracks(); renderNext();
    const board = document.getElementById("board"); board.replaceChildren();
    redrawEdges = () => {};
    (S.view === "list" ? renderList : renderPath)(board);
    paintView(); paintFilter();
  }
  function setStatus(id, v) {
    if (v === "todo") delete S.status[id]; else S.status[id] = v;
    save(); render(); if (drawer.classList.contains("open")) fillDrawer(id);
  }

  /* ----- drawer ----- */
  const drawer = document.getElementById("drawer"), scrim = document.getElementById("scrim");
  let returnFocus = null;
  function copy(text, note) {
    const done = (msg) => { note.textContent = msg; };
    const fallback = () => {
      const ta = h("textarea"); ta.value = text; ta.style.cssText = "position:fixed;opacity:0"; document.body.append(ta); ta.select();
      let ok = false; try { ok = document.execCommand("copy"); } catch { ok = false; }
      ta.remove(); done(ok ? "복사했어요" : "경로를 선택한 뒤 Ctrl+C로 복사하세요");
    };
    try { navigator.clipboard.writeText(text).then(() => done("복사했어요"), fallback); } catch { fallback(); }
  }
  function fillDrawer(id) {
    const m = byId.get(id), t = trackOf.get(m.track) || {};
    drawer.style.setProperty("--c", cvar(t.color)); drawer.replaceChildren();
    const head = h("div", "rm-dh"), x = h("button", "rm-x", "×"); x.type = "button"; x.setAttribute("aria-label", "닫기"); x.onclick = closeDrawer;
    const title = h("h3", "", m.title); title.id = "dtitle";
    const meta = h("div", "meta"); [t.name, m.level, `${m.hours}시간`].forEach((s) => meta.append(h("span", "", s)));
    head.append(h("div", "id", m.id), title, meta, x);
    const body = h("div", "rm-db");
    const sec = (label, ...nodes) => { const s = h("section"); s.append(h("h4", "", label), ...nodes); body.append(s); };
    const sc = h("div"); chips(sc, [["todo", "예정"], ["doing", "진행 중"], ["done", "완료"]], () => st(id), (v) => setStatus(id, v), "진행 상태");
    const stNodes = [sc];
    if (!ready(m) && st(id) !== "done") stNodes.push(h("p", "rm-warn", "아직 끝나지 않은 선수 모듈: " + m.prereq.filter((p) => st(p) !== "done").join(", ")));
    sec("진행 상태", ...stNodes);
    if ((m.outcomes || []).length) { const ul = h("ul"); m.outcomes.forEach((o) => ul.append(h("li", "", o))); sec("학습 목표", ul); }
    const linkList = (ids) => {
      const box = h("div", "rm-links");
      ids.forEach((pid) => { const pm = byId.get(pid); if (!pm) return; const b = h("button", "rm-link"); b.type = "button";
        b.style.setProperty("--c", cvar((trackOf.get(pm.track) || {}).color)); b.append(statusBadge(pid), h("span", "id", pid), pm.title);
        b.onclick = () => { selectCard(pid); fillDrawer(pid); }; box.append(b); });
      return box;
    };
    if ((m.prereq || []).length) sec("선수 모듈", linkList(m.prereq));
    if ((kids.get(id) || []).length) sec("이어지는 모듈", linkList(kids.get(id)));
    if ((m.refs || []).length) { const ul = h("ul"); m.refs.forEach((r) => ul.append(h("li", "", r))); sec("교재·자료", ul); }
    if (m.page) {
      const row = h("div", "rm-path"), code = h("code", "", m.page), btn = h("button", "btn", "경로 복사"), note = h("p", "rm-hint", "앱 사이드바에서 이 경로의 페이지를 여세요.");
      btn.type = "button"; btn.onclick = () => copy(m.page, note); row.append(code, btn); sec("강의 페이지", row, note);
    } else {
      sec("강의 페이지", h("p", "rm-hint", `아직 없음 — 사내 LLM에 "${m.id} ${m.title} 강의 만들어줘"(lecture-html 스킬)로 요청하세요.`));
    }
    const ta = h("textarea"); ta.value = S.memo[id] || ""; ta.placeholder = "막힌 곳, 다시 볼 식, 업무에 쓸 아이디어…"; ta.setAttribute("aria-label", "메모");
    ta.oninput = () => { if (ta.value.trim()) S.memo[id] = ta.value; else delete S.memo[id]; save(); };
    sec("메모", ta);
    drawer.append(head, body);
  }
  function selectCard(id) { selected = id; redrawEdges(); }
  function openDrawer(id, from) {
    returnFocus = from || document.activeElement; selectCard(id); fillDrawer(id);
    drawer.classList.add("open"); scrim.classList.add("open"); drawer.focus({ preventScroll: true });
  }
  function closeDrawer() {
    drawer.classList.remove("open"); scrim.classList.remove("open"); selected = null; redrawEdges();
    const id = returnFocus && returnFocus.dataset && returnFocus.dataset.id;
    const again = id && document.querySelector(`#board [data-id="${id}"]`);
    (again || returnFocus || q).focus({ preventScroll: true });
  }
  scrim.onclick = closeDrawer;
  addEventListener("keydown", (e) => {
    if (e.key === "Escape" && drawer.classList.contains("open")) { e.preventDefault(); closeDrawer(); return; }
    if (e.key === "/" && !/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) { e.preventDefault(); q.focus(); }
  });
  q.addEventListener("input", () => render());

  let paintView = () => {}, paintFilter = () => {};
  async function boot() {
    setSave("busy");
    const paintTheme = chips(document.getElementById("theme"), [["auto", "자동"], ["light", "밝게"], ["dark", "어둡게"]], () => S.theme, (v) => { S.theme = v; applyTheme(); save(); requestAnimationFrame(() => redrawEdges()); }, "테마");
    paintView = chips(document.getElementById("view"), [["path", "경로"], ["list", "목록"]], () => S.view, (v) => { S.view = v; save(); render(); }, "보기");
    paintFilter = chips(document.getElementById("sfilter"), [["all", "전체"], ["todo", "남은 것"], ["doing", "진행 중"], ["done", "완료"]], () => S.sfilter, (v) => { S.sfilter = v; save(); render(); }, "상태");
    render();
    await load();
    applyTheme(); paintTheme(); render(); setSave(mode);
  }
  boot();
})();
</script>
<!-- mi-lecture-runtime:end -->
</body>
</html>
